<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — Poopi Games</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg: #fbfbfd;
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #a1a1a6;
    --card-bg: #fff;
    --card-border: rgba(0,0,0,0.08);
    --nav-bg: rgba(251,251,253,0.8);
    --blue: #0071e3;
    --stat-bg: rgba(0,0,0,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000;
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a6;
      --text-tertiary: #6e6e73;
      --card-bg: #1c1c1e;
      --card-border: rgba(255,255,255,0.08);
      --nav-bg: rgba(0,0,0,0.72);
      --stat-bg: rgba(255,255,255,0.06);
    }
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ── Nav ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 48px;
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--card-border);
    display: flex; align-items: center; justify-content: center;
  }
  .nav-inner {
    width: 100%; max-width: 600px;
    padding: 0 22px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-back {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.85rem; color: var(--blue);
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .nav-back:hover { opacity: 0.75; }
  .nav-back svg { width: 16px; height: 16px; }
  .nav-title {
    font-size: 0.9rem; font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  .nav-spacer { width: 60px; }

  /* ── Main layout ── */
  #app {
    margin-top: 48px;
    display: flex; flex-direction: column; align-items: center;
    gap: 16px;
    padding: 32px 22px 48px;
    width: 100%;
  }

  /* ── Page header ── */
  .page-header { text-align: center; }
  .page-header h1 {
    font-size: 2rem; font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .page-header p {
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  /* ── HUD ── */
  #hud {
    display: flex; gap: 10px;
    width: 100%; max-width: 400px;
  }
  .hud-box {
    flex: 1; text-align: center;
    padding: 10px 8px;
    background: var(--stat-bg);
    border-radius: 12px;
  }
  .hud-label {
    font-size: 0.6rem; font-weight: 600;
    letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 3px;
  }
  .hud-val {
    font-size: 1.35rem; font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--text-primary);
  }

  /* Speed pips */
  #speed-pips { display: flex; gap: 3px; justify-content: center; margin-top: 5px; }
  .pip {
    width: 6px; height: 10px; border-radius: 2px;
    background: var(--card-border);
    transition: background 0.1s, box-shadow 0.1s;
  }
  .pip.on-1 { background: #30d158; box-shadow: 0 0 4px #30d15888; }
  .pip.on-2 { background: #ff9f0a; box-shadow: 0 0 4px #ff9f0a88; }
  .pip.on-3 { background: #ff453a; box-shadow: 0 0 4px #ff453a88; }

  /* ── Canvas ── */
  #canvas-wrap {
    position: relative; display: inline-block;
    cursor: crosshair;
    border-radius: 16px;
    box-shadow:
      0 2px 8px rgba(0,0,0,0.08),
      0 20px 60px rgba(0,0,0,0.12),
      0 0 0 1px var(--card-border);
    overflow: hidden;
  }
  canvas { display: block; border-radius: 16px; }

  /* ── Overlay ── */
  #overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    border-radius: 16px;
    cursor: pointer;
  }
  #overlay.hidden { display: none; }

  .ov-icon {
    font-size: 48px; line-height: 1;
    animation: pulse-icon 1.8s ease-in-out infinite;
  }
  @keyframes pulse-icon {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.1); }
  }
  .ov-title {
    font-size: 1.4rem; font-weight: 700;
    letter-spacing: -0.02em;
    color: #fff;
  }
  #ov-score {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.6);
    display: none;
  }
  .ov-hint {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.35);
    margin-top: 4px;
  }

  .ov-start .ov-icon  { filter: drop-shadow(0 0 12px rgba(0,113,227,0.8)); }
  .ov-dead  .ov-icon  { animation: none; }
  .ov-dead  .ov-title { color: #ff453a; }

  /* ── Hint ── */
  #hint {
    font-size: 0.72rem;
    color: var(--text-tertiary);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-back" href="index.html">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Games
    </a>
    <span class="nav-title">Snake</span>
    <span class="nav-spacer"></span>
  </div>
</nav>

<div id="app">
  <div class="page-header">
    <h1>Snake</h1>
    <p>Las Vegas Edition</p>
  </div>

  <div id="hud">
    <div class="hud-box"><div class="hud-label">Score</div><div class="hud-val" id="score-val">0</div></div>
    <div class="hud-box"><div class="hud-label">Speed</div><div id="speed-pips"></div></div>
    <div class="hud-box"><div class="hud-label">Best</div><div class="hud-val" id="best-val">0</div></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="overlay" class="ov-start">
      <div class="ov-icon">▶</div>
      <div class="ov-title">Tap to Play</div>
      <div id="ov-score"></div>
      <div class="ov-hint">tap · drag · swipe to steer</div>
    </div>
  </div>

  <div id="hint">Swipe or drag on the canvas to steer</div>
</div>

<script>
(function () {
  // ── Constants ──────────────────────────────────────────────
  const COLS = 20, ROWS = 20;
  // Fit a strict 20×20 grid: each cell = 20px → canvas = 400×400
  const CELL = 20;
  const W = COLS * CELL, H = ROWS * CELL;   // exactly 400 × 400

  const BASE_SPEED = 160, SPEED_STEP = 8, MIN_SPEED = 55;
  const PIP_COUNT  = 12;

  // Neon palette
  const C = {
    bg:       '#0a0010',
    grid:     'rgba(255,255,255,0.03)',
    gridLine: 'rgba(255,0,200,0.06)',
    head:     '#ff00cc',
    headGlow: '#ff00cc',
    body1:    '#cc00aa',
    body2:    '#6600aa',
    food:     '#ffe600',
    foodGlow: '#ffe600',
    border:   '#ff00cc',
    eyeBg:    '#0a0010',
  };

  // ── DOM ────────────────────────────────────────────────────
  const canvas  = document.getElementById('c');
  const ctx     = canvas.getContext('2d');
  canvas.width  = W;
  canvas.height = H;

  const scoreEl = document.getElementById('score-val');
  const bestEl  = document.getElementById('best-val');
  const pipsEl  = document.getElementById('speed-pips');
  const overlay = document.getElementById('overlay');
  const ovIcon  = document.querySelector('.ov-icon');
  const ovTitle = document.querySelector('.ov-title');
  const ovScore = document.getElementById('ov-score');

  const pips = Array.from({length: PIP_COUNT}, () => {
    const p = document.createElement('div');
    p.className = 'pip';
    pipsEl.appendChild(p);
    return p;
  });

  // ── State ──────────────────────────────────────────────────
  let snake   = [{x:10,y:10}];
  let dir     = {x:1,y:0};
  let nextDir = {x:1,y:0};
  let food    = {x:5,y:5};
  let score   = 0, best = 0, speed = BASE_SPEED;
  let running = false, loopId = null;

  // ── Helpers ────────────────────────────────────────────────
  function randomFood() {
    let f;
    do { f = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; }
    while (snake.some(s => s.x===f.x && s.y===f.y));
    return f;
  }

  function setScore(v) { score=v; scoreEl.textContent=v; }

  function updatePips() {
    const level = Math.min(PIP_COUNT, Math.floor((BASE_SPEED-speed)/SPEED_STEP)+1);
    pips.forEach((p,i) => {
      p.className = 'pip' + (i>=level ? '' : i<4 ? ' on-1' : i<8 ? ' on-2' : ' on-3');
    });
  }

  function lerpHex(a, b, t) {
    const h=s=>parseInt(s,16);
    const ah=a.slice(1), bh=b.slice(1);
    const r=Math.round(h(ah.slice(0,2))+(h(bh.slice(0,2))-h(ah.slice(0,2)))*t).toString(16).padStart(2,'0');
    const g=Math.round(h(ah.slice(2,4))+(h(bh.slice(2,4))-h(ah.slice(2,4)))*t).toString(16).padStart(2,'0');
    const b2=Math.round(h(ah.slice(4,6))+(h(bh.slice(4,6))-h(ah.slice(4,6)))*t).toString(16).padStart(2,'0');
    return '#'+r+g+b2;
  }

  function rRect(x,y,w,h,r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath();
  }

  // ── Draw ───────────────────────────────────────────────────
  function draw() {
    // BG
    ctx.fillStyle = C.bg;
    ctx.fillRect(0,0,W,H);

    // Grid — strict 20×20 lines
    ctx.strokeStyle = C.gridLine;
    ctx.lineWidth   = 0.5;
    for (let x=0; x<=COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,H); ctx.stroke();
    }
    for (let y=0; y<=ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(W,y*CELL); ctx.stroke();
    }

    // Corner marks to reinforce the grid
    ctx.fillStyle = 'rgba(255,0,200,0.18)';
    for (let x=0; x<COLS; x++) for (let y=0; y<ROWS; y++) {
      ctx.fillRect(x*CELL, y*CELL, 2, 2);
    }

    // Food glow
    const fx=food.x*CELL+CELL/2, fy=food.y*CELL+CELL/2;
    const grd=ctx.createRadialGradient(fx,fy,0,fx,fy,CELL*1.8);
    grd.addColorStop(0,'rgba(255,230,0,0.6)');
    grd.addColorStop(0.5,'rgba(255,180,0,0.2)');
    grd.addColorStop(1,'rgba(255,180,0,0)');
    ctx.fillStyle=grd;
    ctx.fillRect(fx-CELL*2,fy-CELL*2,CELL*4,CELL*4);

    // Food — diamond shape for Vegas flair
    ctx.save();
    ctx.shadowColor=C.foodGlow; ctx.shadowBlur=20;
    ctx.fillStyle=C.food;
    ctx.translate(fx,fy);
    ctx.rotate(Math.PI/4);
    const ds=CELL*0.38;
    ctx.fillRect(-ds,-ds,ds*2,ds*2);
    ctx.restore();

    // Food inner shine
    ctx.save();
    ctx.fillStyle='rgba(255,255,255,0.7)';
    ctx.translate(fx,fy);
    ctx.rotate(Math.PI/4);
    ctx.fillRect(-ds*0.35,-ds*0.35,ds*0.7,ds*0.7);
    ctx.restore();

    // Snake
    const len=snake.length;
    snake.forEach((seg,i) => {
      const t=i/(len-1||1);
      const sx=seg.x*CELL+1, sy=seg.y*CELL+1, sz=CELL-2;
      ctx.save();
      if (i===0) {
        ctx.shadowColor=C.headGlow; ctx.shadowBlur=25;
        ctx.fillStyle=C.head;
      } else {
        // body fades pink→purple
        ctx.fillStyle = lerpHex(C.body1, C.body2, Math.min(t*1.5, 1));
        if (i<3) { ctx.shadowColor=C.head; ctx.shadowBlur=10; }
      }
      rRect(sx,sy,sz,sz,4);
      ctx.fill();

      // Segment border glow
      if (i<5) {
        ctx.strokeStyle = i===0 ? 'rgba(255,180,255,0.6)' : 'rgba(200,0,200,0.3)';
        ctx.lineWidth = 0.8;
        rRect(sx,sy,sz,sz,4);
        ctx.stroke();
      }
      ctx.restore();

      // Head eyes
      if (i===0) {
        ctx.fillStyle=C.eyeBg;
        const ex=seg.x*CELL+CELL/2+dir.x*4, ey=seg.y*CELL+CELL/2+dir.y*4;
        const ox=dir.y*3.5, oy=dir.x*3.5;
        ctx.beginPath(); ctx.arc(ex+ox,ey-oy,2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex-ox,ey+oy,2,0,Math.PI*2); ctx.fill();
        // pupils gleam
        ctx.fillStyle='rgba(255,255,255,0.8)';
        ctx.beginPath(); ctx.arc(ex+ox+0.5,ey-oy-0.5,0.7,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex-ox+0.5,ey+oy-0.5,0.7,0,Math.PI*2); ctx.fill();
      }
    });

    // Outer neon border
    ctx.save();
    ctx.strokeStyle='#ff00cc'; ctx.lineWidth=2;
    ctx.shadowColor='#ff00cc'; ctx.shadowBlur=20;
    ctx.strokeRect(1,1,W-2,H-2);
    ctx.restore();
  }

  // ── Tick ───────────────────────────────────────────────────
  function tick() {
    dir = nextDir;
    const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};

    if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)) {
      clearInterval(loopId); loopId=null; running=false;
      if (score>best) { best=score; bestEl.textContent=best; }
      overlay.className='ov-dead';
      ovIcon.textContent='💀';
      ovTitle.textContent='GAME OVER';
      ovScore.textContent='Score: '+score; ovScore.style.display='block';
      overlay.classList.remove('hidden'); // ensure visible
      return;
    }

    snake.unshift(head);
    if (head.x===food.x && head.y===food.y) {
      setScore(score+1);
      food=randomFood();
      speed=Math.max(MIN_SPEED,speed-SPEED_STEP);
      updatePips();
      clearInterval(loopId);
      loopId=setInterval(tick,speed);
    } else {
      snake.pop();
    }
    draw();
  }

  // ── Start ──────────────────────────────────────────────────
  function startGame() {
    if (loopId) { clearInterval(loopId); loopId=null; }
    snake   = [{x:10,y:10}];
    dir     = {x:1,y:0};
    nextDir = {x:1,y:0};
    food    = randomFood();
    speed   = BASE_SPEED;
    running = true;
    setScore(0);
    updatePips();
    overlay.className = 'ov-start hidden';
    ovScore.style.display='none';
    draw();
    loopId=setInterval(tick,speed);
  }

  // ── Direction ──────────────────────────────────────────────
  function applyDir(dx,dy) {
    let d;
    if (Math.abs(dx)>Math.abs(dy)) d = dx>0?{x:1,y:0}:{x:-1,y:0};
    else                           d = dy>0?{x:0,y:1}:{x:0,y:-1};
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir=d;
  }

  // ── Input ──────────────────────────────────────────────────
  overlay.addEventListener('click', () => { if(!running) startGame(); });

  const KEY_MAP={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
  document.addEventListener('keydown', e => {
    if (!KEY_MAP[e.key]) return;
    e.preventDefault();
    if (!running) { startGame(); return; }
    applyDir(KEY_MAP[e.key].x*10, KEY_MAP[e.key].y*10);
  });

  let dragX,dragY,dragging=false;
  canvas.addEventListener('mousedown', e => { dragX=e.clientX; dragY=e.clientY; dragging=true; });
  document.addEventListener('mouseup', e => {
    if (!dragging) return; dragging=false;
    const dx=e.clientX-dragX, dy=e.clientY-dragY;
    if (Math.abs(dx)<6&&Math.abs(dy)<6) { if(!running) startGame(); return; }
    if (!running) { startGame(); return; }
    applyDir(dx,dy);
  });

  let tX,tY;
  canvas.addEventListener('touchstart', e => { tX=e.touches[0].clientX; tY=e.touches[0].clientY; e.preventDefault(); },{passive:false});
  canvas.addEventListener('touchend', e => {
    const dx=e.changedTouches[0].clientX-tX, dy=e.changedTouches[0].clientY-tY;
    if (Math.abs(dx)<10&&Math.abs(dy)<10) { if(!running) startGame(); return; }
    if (!running) { startGame(); return; }
    applyDir(dx,dy);
    e.preventDefault();
  },{passive:false});

  draw();
})();
</script>
</body>
</html>
