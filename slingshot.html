<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slingshot — Poopi Games</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg: #fbfbfd;
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #a1a1a6;
    --card-bg: #fff;
    --card-border: rgba(0,0,0,0.08);
    --nav-bg: rgba(251,251,253,0.8);
    --blue: #0071e3;
    --stat-bg: rgba(0,0,0,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000;
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a6;
      --text-tertiary: #6e6e73;
      --card-bg: #1c1c1e;
      --card-border: rgba(255,255,255,0.08);
      --nav-bg: rgba(0,0,0,0.72);
      --stat-bg: rgba(255,255,255,0.06);
    }
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 48px;
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--card-border);
    display: flex; align-items: center; justify-content: center;
  }
  .nav-inner {
    width: 100%; max-width: 620px;
    padding: 0 22px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-back {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.85rem; color: var(--blue);
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .nav-back:hover { opacity: 0.75; }
  .nav-back svg { width: 16px; height: 16px; }
  .nav-title {
    font-size: 0.9rem; font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  .nav-spacer { width: 60px; }

  #app {
    margin-top: 48px;
    display: flex; flex-direction: column; align-items: center;
    gap: 16px;
    padding: 32px 22px 48px;
    width: 100%;
  }

  .page-header { text-align: center; }
  .page-header h1 {
    font-size: 2rem; font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .page-header p {
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  #hud {
    display: flex; gap: 10px;
    width: 100%; max-width: 560px;
  }
  .hud-box {
    flex: 1; text-align: center;
    padding: 10px 8px;
    background: var(--stat-bg);
    border-radius: 12px;
  }
  .hud-label {
    font-size: 0.6rem; font-weight: 600;
    letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 3px;
  }
  .hud-val {
    font-size: 1.35rem; font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--text-primary);
  }

  #canvas-wrap {
    position: relative; display: inline-block;
    cursor: crosshair;
    border-radius: 16px;
    box-shadow:
      0 2px 8px rgba(0,0,0,0.08),
      0 20px 60px rgba(0,0,0,0.12),
      0 0 0 1px var(--card-border);
    overflow: hidden;
  }
  canvas { display: block; border-radius: 16px; }

  #overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    border-radius: 16px;
    cursor: pointer;
  }
  #overlay.hidden { display: none; }

  .ov-icon {
    font-size: 48px; line-height: 1;
    animation: pulse-icon 1.8s ease-in-out infinite;
  }
  @keyframes pulse-icon {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.1); }
  }
  .ov-title {
    font-size: 1.4rem; font-weight: 700;
    letter-spacing: -0.02em;
    color: #fff;
  }
  .ov-sub {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.6);
    display: none;
  }
  .ov-hint {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.35);
    margin-top: 4px;
  }

  .ov-dead .ov-icon  { animation: none; }
  .ov-dead .ov-title { color: #ff453a; }
  .ov-win  .ov-title { color: #ffd60a; }

  #hint {
    font-size: 0.72rem;
    color: var(--text-tertiary);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-back" href="index.html">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Games
    </a>
    <span class="nav-title">Slingshot</span>
    <span class="nav-spacer"></span>
  </div>
</nav>

<div id="app">
  <div class="page-header">
    <h1>Slingshot</h1>
    <p>Pull back, aim, and launch. Take down every target.</p>
  </div>

  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">Score</div>
      <div class="hud-val" id="score-val">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Level</div>
      <div class="hud-val" id="level-val">1</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Balls</div>
      <div class="hud-val" id="balls-val">5</div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="overlay">
      <div class="ov-icon">🏹</div>
      <div class="ov-title" id="ov-title">Slingshot</div>
      <div class="ov-sub" id="ov-sub"></div>
      <div class="ov-hint" id="ov-hint">Click or tap to play</div>
    </div>
  </div>

  <p id="hint">Drag the ball back and release to launch</p>
</div>

<script>
(function(){
  // ── World & View ──────────────────────────────────────────────
  const VW=560, VH=360;
  const WORLD_W=1800;
  const GROUND_Y=VH-50;
  const GRAVITY=0.32;
  const BOUNCE=0.42, FRICTION=0.80;
  const BALL_R=11;
  const MAX_PULL=80;
  const SLING_WX=110, SLING_WY=GROUND_Y-60;

  let camX=0, camTargetX=0;

  function toScreen(wx){ return wx - camX; }

  // ── Level generator ───────────────────────────────────────────
  const GY = GROUND_Y;

  function makeTower(ox, cols, rows, s, hp) {
    const pad = 2, targets = [];
    for (let r = 0; r < rows; r++) {
      const rowCols = Math.max(1, cols - r);
      const rowX = ox + r * (s + pad) / 2;
      for (let c = 0; c < rowCols; c++) {
        targets.push({
          x: rowX + c * (s + pad),
          y: GY - (r + 1) * s - r * pad,
          w: s, h: s, hp, maxHp: hp
        });
      }
    }
    return targets;
  }

  function buildLevel(lvl) {
    const baseRows = 3;
    const rows = baseRows + (lvl - 1) * 2;
    const balls = 4 + lvl;
    const s = 26;
    const pad = 3;
    const numTowers = Math.min(lvl, 3);
    const spacing = numTowers === 1 ? 0 : numTowers === 2 ? 200 : 160;
    const baseX = numTowers === 1 ? 1310 : numTowers === 2 ? 1220 : 1160;
    let targets = [];
    for (let t = 0; t < numTowers; t++) {
      const ox = baseX + t * (spacing + (s + pad) * 3);
      const hp = Math.min(t + 1, 3);
      targets = targets.concat(makeTower(ox, 4, rows, s, hp));
    }
    return { balls, targets };
  }

  // ── DOM ───────────────────────────────────────────────────────
  const canvas=document.getElementById('c');
  const ctx=canvas.getContext('2d');
  canvas.width=VW; canvas.height=VH;
  const scoreEl=document.getElementById('score-val');
  const ballsEl=document.getElementById('balls-val');
  const levelEl=document.getElementById('level-val');
  const overlay=document.getElementById('overlay');
  const ovTitle=document.getElementById('ov-title');
  const ovSub=document.getElementById('ov-sub');
  const ovHint=document.getElementById('ov-hint');

  // ── State ─────────────────────────────────────────────────────
  let score,ballsLeft,level,running,loopId;
  let targets=[],particles=[],trails=[],floatingTexts=[];
  let ball=null;
  let pulling=false,pullX=0,pullY=0;
  let settling=false,settleTimer=0;
  let shakeX=0,shakeY=0,shakeDecay=0;
  let bestScore=parseInt(localStorage.getItem('slingshot-best'))||0;

  // ── Camera ────────────────────────────────────────────────────
  function updateCamera(){
    const LERP=0.06;
    if(!ball||!ball.flying){
      camTargetX=0;
    } else {
      camTargetX=ball.x - VW*0.35;
    }
    camTargetX=Math.max(0, Math.min(WORLD_W-VW, camTargetX));
    camX+=(camTargetX-camX)*LERP;
  }

  // ── Init ──────────────────────────────────────────────────────
  function initLevel(){
    const cfg=buildLevel(level);
    targets=cfg.targets.map(t=>({
      x:t.x, y:t.y, w:t.w, h:t.h, hp:t.hp, maxHp:t.hp,
      vx:0, vy:0, flash:0,
    }));
    ballsLeft=cfg.balls;
    particles=[]; trails=[]; floatingTexts=[];
    camX=0; camTargetX=0;
    resetBall();
    updateHUD();
  }

  function startGame(){
    score=0; level=1;
    scoreEl.textContent=0; levelEl.textContent=1;
    initLevel();
    overlay.className='hidden';
    running=true;
    if(loopId)cancelAnimationFrame(loopId);
    loopId=requestAnimationFrame(gameLoop);
  }

  function resetBall(){
    ball={x:SLING_WX,y:SLING_WY,vx:0,vy:0,r:BALL_R,flying:false,settled:false};
    pulling=false; settling=false; settleTimer=0;
    camTargetX=0;
  }

  function updateHUD(){
    ballsEl.textContent='●'.repeat(Math.max(0,ballsLeft));
    scoreEl.textContent=score;
    levelEl.textContent=level;
  }

  // ── Particles ─────────────────────────────────────────────────
  function spawnHit(x,y,color){
    for(let i=0;i<16;i++){
      const a=Math.random()*Math.PI*2,sp=2+Math.random()*5;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,color,size:2+Math.random()*4});
    }
  }
  function spawnDust(x,y){
    for(let i=0;i<8;i++){
      const a=Math.PI+Math.random()*Math.PI,sp=1+Math.random()*3;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:0.7,color:'#cc8844',size:2+Math.random()*3});
    }
  }
  function spawnDebris(x,y,w,h,color){
    for(let i=0;i<12;i++){
      const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*4;
      particles.push({x:x+Math.random()*w,y:y+Math.random()*h,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,life:1,color,size:3+Math.random()*5});
    }
  }
  function spawnFloating(x,y,text,color){
    floatingTexts.push({x,y,text,color,life:1});
  }
  function triggerShake(intensity){
    shakeDecay=intensity;
  }

  // ── Physics ───────────────────────────────────────────────────
  function updateBall(){
    if(!ball.flying)return;

    trails.push({x:ball.x,y:ball.y,life:1});
    if(trails.length>24)trails.shift();

    ball.vy+=GRAVITY;
    ball.x+=ball.vx;
    ball.y+=ball.vy;

    if(ball.y+ball.r>=GROUND_Y){
      ball.y=GROUND_Y-ball.r;
      ball.vy*=-BOUNCE;
      ball.vx*=FRICTION;
      spawnDust(ball.x,GROUND_Y);
      if(Math.abs(ball.vy)<0.8)ball.vy=0;
      if(Math.abs(ball.vx)<0.3&&Math.abs(ball.vy)<0.5)ball.settled=true;
    }
    if(ball.x-ball.r<0){ball.x=ball.r;ball.vx*=-BOUNCE;}
    if(ball.x+ball.r>WORLD_W){ball.x=WORLD_W-ball.r;ball.vx*=-BOUNCE;}
    if(ball.y-ball.r<0){ball.y=ball.r;ball.vy*=-BOUNCE;}

    targets.forEach(t=>{
      if(t.hp<=0)return;
      if(ball.x+ball.r>t.x&&ball.x-ball.r<t.x+t.w&&ball.y+ball.r>t.y&&ball.y-ball.r<t.y+t.h){
        const cx=t.x+t.w/2,cy=t.y+t.h/2;
        const dx=ball.x-cx,dy=ball.y-cy;
        if(Math.abs(dx)/t.w>Math.abs(dy)/t.h)ball.vx=Math.abs(ball.vx)*(dx>0?1:-1);
        else ball.vy=Math.abs(ball.vy)*(dy>0?1:-1);
        t.vx+=ball.vx*0.35;
        t.vy+=Math.min(ball.vy*0.35,-1.5);
        t.hp--; t.flash=6;
        const pts=t.maxHp===1?10:t.maxHp===2?25:50;
        score+=pts; updateHUD();
        const cols=['#00ffe7','#ffe600','#ff00cc'];
        const col=cols[Math.min(t.maxHp-1,2)];
        spawnHit(cx,cy,col);
        triggerShake(t.hp<=0?6:3);
        if(t.hp<=0){
          spawnDebris(t.x,t.y,t.w,t.h,col);
          spawnFloating(cx,cy-10,'+'+pts*2,col);
        } else {
          spawnFloating(cx,cy-10,'+'+pts,col);
        }
      }
    });
  }

  function updateTargets(){
    targets.forEach(t=>{
      if(t.hp<=0)return;
      t.vy+=GRAVITY*0.9;
      t.x+=t.vx; t.y+=t.vy;
      t.vx*=0.88;
      if(t.y+t.h>=GROUND_Y){t.y=GROUND_Y-t.h;t.vy*=-0.28;t.vx*=FRICTION;if(Math.abs(t.vy)<0.8)t.vy=0;}
      if(t.x<0){t.x=0;t.vx*=-0.4;}
      if(t.x+t.w>WORLD_W){t.x=WORLD_W-t.w;t.vx*=-0.4;}
      if(t.flash>0)t.flash--;
    });
  }

  function updateParticles(){
    particles=particles.filter(p=>p.life>0);
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=0.035;});
    trails=trails.filter(t=>t.life>0);
    trails.forEach(t=>t.life-=0.06);
    floatingTexts=floatingTexts.filter(f=>f.life>0);
    floatingTexts.forEach(f=>{f.y-=0.8;f.life-=0.02;});
    if(shakeDecay>0){
      shakeX=(Math.random()-0.5)*shakeDecay;
      shakeY=(Math.random()-0.5)*shakeDecay;
      shakeDecay*=0.85;
      if(shakeDecay<0.3){shakeDecay=0;shakeX=0;shakeY=0;}
    }
  }

  // ── Draw ──────────────────────────────────────────────────────
  const isDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;

  function draw(){
    const dark = isDark();
    const bgColor = dark ? '#0a0a12' : '#f0f0f5';

    ctx.fillStyle=bgColor; ctx.fillRect(0,0,VW,VH);

    ctx.save();
    ctx.translate(-camX+shakeX,shakeY);

    drawWorld(dark);
    drawSlingshot();
    drawAimGuide();
    drawTargets();
    drawBallEl();
    drawParticles();
    drawFloatingTexts();

    ctx.restore();

    drawMinimap();
    drawCanvasHint();
  }

  function drawWorld(dark){
    // Subtle star dots
    ctx.fillStyle = dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.04)';
    for(let i=0;i<80;i++){
      const sx=((i*337)%WORLD_W), sy=((i*179)%(GROUND_Y-20));
      ctx.fillRect(sx,sy,1,1);
    }

    // City silhouette
    ctx.fillStyle='rgba(255,0,200,0.05)';
    const buildings=[
      [600,80],[640,50],[680,70],[730,40],[780,60],[850,30],[920,55],[980,45],
      [1050,70],[1100,35],[1160,60],[1250,25],[1350,50],[1450,40],[1550,65],[1650,30],[1720,55]
    ];
    buildings.forEach(([bx,bh])=>{ ctx.fillRect(bx,GROUND_Y-bh,30,bh); });

    // Ground line
    ctx.save();
    ctx.shadowColor='#ff00cc'; ctx.shadowBlur=8;
    ctx.strokeStyle='rgba(255,0,204,0.4)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(WORLD_W,GROUND_Y); ctx.stroke();
    const gg=ctx.createLinearGradient(0,GROUND_Y,0,VH);
    gg.addColorStop(0,'rgba(255,0,200,0.08)'); gg.addColorStop(1,'rgba(255,0,200,0)');
    ctx.fillStyle=gg; ctx.fillRect(0,GROUND_Y,WORLD_W,VH-GROUND_Y);
    ctx.restore();

    // Target arrow hint
    if(camX<200 && (!ball||!ball.flying)){
      ctx.save();
      ctx.globalAlpha=0.5+0.3*Math.sin(Date.now()/400);
      ctx.fillStyle='#ffe600';
      ctx.shadowColor='#ffe600'; ctx.shadowBlur=10;
      ctx.font='bold 12px system-ui'; ctx.textAlign='center';
      ctx.fillText('TARGET ▶▶▶', VW*0.75+camX, GROUND_Y-16);
      ctx.restore();
    }
  }

  function drawSlingshot(){
    const fx=SLING_WX, fy=SLING_WY;
    ctx.save();
    ctx.strokeStyle='#cc8840'; ctx.lineWidth=7; ctx.lineCap='round';
    ctx.shadowColor='#ff8800'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.moveTo(fx,GROUND_Y); ctx.lineTo(fx-12,fy-14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx,GROUND_Y); ctx.lineTo(fx+12,fy-14); ctx.stroke();
    ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(fx-12,fy-14); ctx.lineTo(fx-22,fy-32); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx+12,fy-14); ctx.lineTo(fx+22,fy-32); ctx.stroke();
    if(!ball.flying&&!ball.settled){
      const bx=pulling?pullX:ball.x, by=pulling?pullY:ball.y;
      ctx.lineWidth=3; ctx.shadowColor='#ffe600'; ctx.shadowBlur=10; ctx.strokeStyle='#ffe600';
      ctx.beginPath(); ctx.moveTo(fx-22,fy-32); ctx.lineTo(bx,by); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx+22,fy-32); ctx.lineTo(bx,by); ctx.stroke();
    }
    ctx.restore();
  }

  function drawAimGuide(){
    if(!pulling||ball.flying)return;
    const dx=SLING_WX-pullX, dy=SLING_WY-pullY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const power=Math.min(dist/MAX_PULL,1);
    const vx=dx*0.18*power*2, vy=dy*0.18*power*2;
    let px=pullX,py=pullY,pvx=vx,pvy=vy;
    ctx.save();
    for(let i=0;i<32;i++){
      pvy+=GRAVITY; px+=pvx; py+=pvy;
      if(py>GROUND_Y)break;
      ctx.globalAlpha=(1-i/32)*0.5;
      ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(px,py,2,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    const ang=Math.atan2(dy,dx);
    ctx.strokeStyle=`hsl(${120-power*120},100%,60%)`;
    ctx.lineWidth=2; ctx.shadowColor=ctx.strokeStyle; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(SLING_WX,SLING_WY,MAX_PULL,ang-0.3,ang+0.3); ctx.stroke();
    ctx.restore();
  }

  function drawTargets(){
    targets.forEach(t=>{
      if(t.hp<=0)return;
      const ratio=t.hp/t.maxHp;
      let color=t.maxHp===1?'#00ffe7':t.maxHp===2?'#ffe600':'#ff00cc';
      const flash=t.flash>0;
      ctx.save();
      ctx.shadowColor=flash?'#fff':color; ctx.shadowBlur=flash?28:10;
      ctx.fillStyle=flash?'#ffffff':color;
      roundRect(t.x,t.y,t.w,t.h,4); ctx.fill();
      if(ratio<1){
        ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(t.x+t.w*0.3,t.y); ctx.lineTo(t.x+t.w*0.5,t.y+t.h*0.7);
        ctx.moveTo(t.x+t.w*0.7,t.y+t.h*0.15); ctx.lineTo(t.x+t.w*0.35,t.y+t.h);
        ctx.stroke();
      }
      const shine=ctx.createLinearGradient(t.x,t.y,t.x,t.y+t.h);
      shine.addColorStop(0,'rgba(255,255,255,0.3)'); shine.addColorStop(0.5,'rgba(255,255,255,0)');
      ctx.fillStyle=shine; roundRect(t.x,t.y,t.w,t.h/2,4); ctx.fill();
      if(t.maxHp>1){
        for(let i=0;i<t.maxHp;i++){
          ctx.fillStyle=i<t.hp?color:'rgba(0,0,0,0.3)';
          ctx.beginPath(); ctx.arc(t.x+6+i*8,t.y+t.h-6,2.5,0,Math.PI*2); ctx.fill();
        }
      }
      ctx.restore();
    });
  }

  function drawBallEl(){
    if(!ball)return;
    const bx=pulling&&!ball.flying?pullX:ball.x;
    const by=pulling&&!ball.flying?pullY:ball.y;
    if(ball.flying){
      trails.forEach(tr=>{
        ctx.save(); ctx.globalAlpha=tr.life*0.4;
        ctx.fillStyle='#ff00cc';
        ctx.beginPath(); ctx.arc(tr.x,tr.y,Math.max(0,BALL_R*(tr.life*0.8)),0,Math.PI*2); ctx.fill();
        ctx.restore();
      });
    }
    ctx.save();
    ctx.shadowColor='#ff00cc'; ctx.shadowBlur=22;
    const bg=ctx.createRadialGradient(bx-3,by-3,1,bx,by,BALL_R);
    bg.addColorStop(0,'#ffffff'); bg.addColorStop(0.35,'#ff66dd'); bg.addColorStop(1,'#aa0088');
    ctx.fillStyle=bg;
    ctx.beginPath(); ctx.arc(bx,by,BALL_R,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawParticles(){
    particles.forEach(p=>{
      ctx.save(); ctx.globalAlpha=p.life;
      ctx.shadowColor=p.color; ctx.shadowBlur=8; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0,p.size*p.life),0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
  }

  function drawFloatingTexts(){
    floatingTexts.forEach(f=>{
      ctx.save();
      ctx.globalAlpha=f.life;
      ctx.fillStyle=f.color;
      ctx.shadowColor=f.color; ctx.shadowBlur=8;
      ctx.font='bold 14px system-ui'; ctx.textAlign='center';
      ctx.fillText(f.text,f.x,f.y);
      ctx.restore();
    });
  }

  function drawMinimap(){
    const mmW=VW, mmH=8, mmY=0;
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,mmY,mmW,mmH);
    const vpX=(camX/WORLD_W)*mmW, vpW=(VW/WORLD_W)*mmW;
    ctx.fillStyle='rgba(255,0,200,0.35)'; ctx.fillRect(vpX,mmY,vpW,mmH);
    ctx.fillStyle='#ff00cc'; ctx.fillRect((SLING_WX/WORLD_W)*mmW-1,mmY,3,mmH);
    ctx.fillStyle='#ffe600';
    targets.forEach(t=>{ if(t.hp>0) ctx.fillRect((t.x/WORLD_W)*mmW,mmY+2,2,mmH-4); });
    if(ball){ ctx.fillStyle='#ffffff'; ctx.fillRect((ball.x/WORLD_W)*mmW-1,mmY,3,mmH); }
  }

  function drawCanvasHint(){
    if(!running)return;
    ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.font='11px system-ui'; ctx.textAlign='center';
    if(!ball.flying&&!ball.settled) ctx.fillText(pulling?'Release to fire':'Drag ball to aim',VW/2,VH-10);
    if(ball.settled) ctx.fillText('Next ball…',VW/2,VH-10);
  }

  // ── Game Loop ─────────────────────────────────────────────────
  function gameLoop(){
    if(!running)return;
    updateCamera();
    update();
    draw();
    loopId=requestAnimationFrame(gameLoop);
  }

  function update(){
    updateParticles();
    updateBall();
    updateTargets();

    if(ball.flying&&ball.settled&&!settling){
      settling=true; settleTimer=80;
    }
    if(settling){
      settleTimer--;
      if(settleTimer<=0){
        settling=false;
        ballsLeft--;
        updateHUD();
        if(targets.every(t=>t.hp<=0)){levelWin();return;}
        if(ballsLeft<=0){
          running=false;
          if(score>bestScore){bestScore=score;localStorage.setItem('slingshot-best',bestScore);}
          overlay.className='ov-dead';
          ovTitle.textContent='Out of Ammo';
          ovSub.textContent='Score: '+score+(score>=bestScore?' — New Best!':' — Best: '+bestScore);
          ovSub.style.display='block';
          ovHint.textContent='Click or tap to try again';
          overlay.classList.remove('hidden');
          return;
        }
        resetBall();
      }
    }
    if(ball.flying&&targets.every(t=>t.hp<=0)){levelWin();}
  }

  function levelWin(){
    const bonus=ballsLeft*50;
    score+=bonus; updateHUD();
    running=false;
    overlay.className='ov-win';
    ovTitle.textContent='Level Clear!';
    ovSub.textContent='+'+bonus+' bonus'; ovSub.style.display='block';
    ovHint.textContent='';
    overlay.classList.remove('hidden');
    setTimeout(()=>{
      level++; levelEl.textContent=level;
      initLevel();
      overlay.classList.add('hidden');
      ovSub.style.display='none';
      running=true;
      loopId=requestAnimationFrame(gameLoop);
    },2000);
  }

  // ── Input ─────────────────────────────────────────────────────
  function getWorldPos(clientX,clientY){
    const rect=canvas.getBoundingClientRect();
    const sx=(clientX-rect.left)*(VW/rect.width);
    const sy=(clientY-rect.top)*(VH/rect.height);
    return {x:sx+camX, y:sy};
  }

  function onDown(cx,cy){
    if(!running)return;
    const pos=getWorldPos(cx,cy);
    if(ball.flying||ball.settled)return;
    const dx=pos.x-ball.x,dy=pos.y-ball.y;
    if(Math.sqrt(dx*dx+dy*dy)<BALL_R+22){
      pulling=true;
      constrainPull(pos.x,pos.y);
    }
  }

  function onMove(cx,cy){
    if(!pulling||!running)return;
    const pos=getWorldPos(cx,cy);
    constrainPull(pos.x,pos.y);
  }

  function constrainPull(x,y){
    const dx=x-SLING_WX,dy=y-SLING_WY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>MAX_PULL){pullX=SLING_WX+dx/dist*MAX_PULL;pullY=SLING_WY+dy/dist*MAX_PULL;}
    else{pullX=x;pullY=y;}
    if(pullX>SLING_WX+20)pullX=SLING_WX+20;
  }

  function onUp(){
    if(!pulling||!running)return;
    const dx=SLING_WX-pullX,dy=SLING_WY-pullY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<8){pulling=false;resetBall();return;}
    const power=Math.min(dist/MAX_PULL,1);
    ball.x=pullX; ball.y=pullY;
    ball.vx=dx*0.18*power*2;
    ball.vy=dy*0.18*power*2;
    ball.flying=true; pulling=false;
  }

  overlay.addEventListener('click',()=>{ if(!running) startGame(); });
  canvas.addEventListener('mousedown',e=>onDown(e.clientX,e.clientY));
  canvas.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
  canvas.addEventListener('mouseup',onUp);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();onDown(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();onMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  canvas.addEventListener('touchend',e=>{e.preventDefault();onUp();},{passive:false});

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath();
  }

  // Initial preview
  score=0; level=1; ballsLeft=5; particles=[]; trails=[]; floatingTexts=[]; camX=0;
  targets=buildLevel(1).targets.map(t=>({x:t.x,y:t.y,w:t.w,h:t.h,hp:t.hp,maxHp:t.hp,vx:0,vy:0,flash:0}));
  ball={x:SLING_WX,y:SLING_WY,vx:0,vy:0,r:BALL_R,flying:false,settled:false};
  draw();
})();
</script>

</body>
