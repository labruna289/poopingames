<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLINGSHOT — LAS VEGAS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0a0010; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:'Courier New',monospace; overflow:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 20% 50%,rgba(255,0,200,0.08) 0%,transparent 60%),
      radial-gradient(ellipse at 80% 20%,rgba(0,200,255,0.08) 0%,transparent 60%),
      radial-gradient(ellipse at 60% 80%,rgba(255,180,0,0.06) 0%,transparent 60%);
    pointer-events:none; z-index:0;
  }
  body::after {
    content:''; position:fixed; inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.12) 3px,rgba(0,0,0,0.12) 4px);
    pointer-events:none; z-index:200;
  }
  #app { position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; gap:12px; padding:20px; }

  #title-wrap { display:flex; align-items:center; }
  #title { font-family:'Arial Black',sans-serif; font-size:38px; font-weight:900; letter-spacing:5px; line-height:1; user-select:none; }
  .t1{color:#ff00cc;text-shadow:0 0 10px #ff00cc,0 0 30px #ff00cc;}
  .t2{color:#ffffff;text-shadow:0 0 10px #fff;animation:flicker1 4s infinite;}
  .t3{color:#ffe600;text-shadow:0 0 10px #ffe600,0 0 30px #ffe600;}
  .t4{color:#00ffe7;text-shadow:0 0 10px #00ffe7,0 0 30px #00ffe7;animation:flicker2 6s infinite;}
  .t5{color:#ff4400;text-shadow:0 0 10px #ff4400,0 0 30px #ff4400;}
  .t6{color:#cc00ff;text-shadow:0 0 10px #cc00ff,0 0 30px #cc00ff;}
  .t7{color:#ffe600;text-shadow:0 0 10px #ffe600;animation:flicker1 5s infinite;}
  .t8{color:#00ffe7;text-shadow:0 0 10px #00ffe7;}
  .t9{color:#ff00cc;text-shadow:0 0 10px #ff00cc;}
  @keyframes flicker1{0%,96%,100%{opacity:1;}97%{opacity:0.2;}98%{opacity:1;}99%{opacity:0.4;}}
  @keyframes flicker2{0%,88%,92%,100%{opacity:1;}89%{opacity:0.1;}90%{opacity:1;}91%{opacity:0.3;}}

  .bulbs{display:flex;gap:6px;align-items:center;}
  .bulb{width:7px;height:7px;border-radius:50%;animation:bulb-chase 1.2s linear infinite;}
  .bulb:nth-child(1){background:#ff00cc;box-shadow:0 0 6px #ff00cc;animation-delay:0s;}
  .bulb:nth-child(2){background:#ffe600;box-shadow:0 0 6px #ffe600;animation-delay:.15s;}
  .bulb:nth-child(3){background:#00ffe7;box-shadow:0 0 6px #00ffe7;animation-delay:.3s;}
  .bulb:nth-child(4){background:#ff4400;box-shadow:0 0 6px #ff4400;animation-delay:.45s;}
  .bulb:nth-child(5){background:#ff00cc;box-shadow:0 0 6px #ff00cc;animation-delay:.6s;}
  @keyframes bulb-chase{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.15;transform:scale(0.7);}}

  #hud{display:flex;gap:20px;align-items:center;}
  .hud-box{text-align:center;min-width:80px;padding:6px 12px;border:1px solid rgba(255,255,255,0.1);border-radius:4px;background:rgba(0,0,0,0.4);position:relative;}
  .hud-box::before{content:'';position:absolute;inset:-1px;border-radius:4px;background:linear-gradient(135deg,rgba(255,0,204,0.3),rgba(0,255,231,0.3));z-index:-1;filter:blur(4px);}
  .hud-label{font-size:9px;letter-spacing:4px;color:#556677;margin-bottom:2px;}
  .hud-val{font-size:24px;font-weight:700;letter-spacing:2px;line-height:1.1;}
  #score-val{color:#ff00cc;text-shadow:0 0 12px #ff00cc;}
  #balls-val{color:#ffe600;text-shadow:0 0 12px #ffe600;}
  #level-val{color:#00ffe7;text-shadow:0 0 12px #00ffe7;}

  #canvas-wrap{position:relative;display:inline-block;cursor:crosshair;}
  #canvas-wrap::before{content:'';position:absolute;inset:-3px;border-radius:6px;background:linear-gradient(90deg,#ff00cc,#ffe600,#00ffe7,#ff4400,#ff00cc);background-size:300% 100%;animation:border-run 3s linear infinite;z-index:-1;filter:blur(2px);}
  #canvas-wrap::after{content:'';position:absolute;inset:-6px;border-radius:8px;background:linear-gradient(90deg,#ff00cc,#ffe600,#00ffe7,#ff4400,#ff00cc);background-size:300% 100%;animation:border-run 3s linear infinite;z-index:-2;filter:blur(8px);opacity:0.5;}
  @keyframes border-run{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  canvas{display:block;border-radius:3px;}

  #overlay{position:absolute;inset:0;background:rgba(10,0,16,0.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:3px;backdrop-filter:blur(4px);cursor:pointer;}
  #overlay.hidden{display:none;}
  .ov-icon{font-size:50px;line-height:1;animation:pulse-icon 1.5s ease-in-out infinite;}
  @keyframes pulse-icon{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
  .ov-title{font-family:'Arial Black',sans-serif;font-size:22px;letter-spacing:8px;}
  .ov-hint{font-size:11px;letter-spacing:3px;color:#445566;margin-top:2px;}
  #ov-sub{font-size:14px;letter-spacing:4px;color:#aabbcc;display:none;}
  .ov-start .ov-icon{color:#00ffe7;text-shadow:0 0 20px #00ffe7;}
  .ov-start .ov-title{color:#00ffe7;text-shadow:0 0 18px #00ffe7,0 0 40px #00ffe7;}
  .ov-dead .ov-icon{color:#ff4400;text-shadow:0 0 20px #ff4400;animation:none;}
  .ov-dead .ov-title{color:#ff4400;text-shadow:0 0 18px #ff4400,0 0 40px #ff4400;}
  .ov-win .ov-icon{color:#ffe600;text-shadow:0 0 20px #ffe600;}
  .ov-win .ov-title{color:#ffe600;text-shadow:0 0 18px #ffe600,0 0 40px #ffe600;}

  #toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:3px;font-weight:700;padding:4px 14px;border-radius:3px;pointer-events:none;opacity:0;transition:opacity 0.2s;white-space:nowrap;}
  #toast.show{opacity:1;}
  #hint{font-size:10px;letter-spacing:3px;color:#1e1030;margin-top:-4px;}
</style>
</head>
<body>
<div id="app">
  <div id="title-wrap">
    <div class="bulbs"><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div></div>
    &nbsp;
    <div id="title">
      <span class="t1">S</span><span class="t2">L</span><span class="t3">I</span><span class="t4">N</span><span class="t5">G</span><span class="t6">S</span><span class="t7">H</span><span class="t8">O</span><span class="t9">T</span>
    </div>
    &nbsp;
    <div class="bulbs"><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div></div>
  </div>

  <div id="hud">
    <div class="hud-box"><div class="hud-label">SCORE</div><div class="hud-val" id="score-val">0</div></div>
    <div class="hud-box"><div class="hud-label">LEVEL</div><div class="hud-val" id="level-val">1</div></div>
    <div class="hud-box"><div class="hud-label">BALLS</div><div class="hud-val" id="balls-val">●●●●●</div></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="overlay" class="ov-start">
      <div class="ov-icon">🎯</div>
      <div class="ov-title">INSERT COIN</div>
      <div id="ov-sub"></div>
      <div class="ov-hint">drag & release to shoot</div>
    </div>
    <div id="toast"></div>
  </div>
  <div id="hint">← drag the ball back and release to launch →</div>
</div>

<script>
(function(){
  // ── World & View ──────────────────────────────────────────────
  const VW=560, VH=360;          // visible canvas size
  const WORLD_W=1800;            // total world width
  const GROUND_Y=VH-50;         // ground in view-space (constant)
  const GRAVITY=0.32;
  const BOUNCE=0.42, FRICTION=0.80;
  const BALL_R=11;
  const MAX_PULL=80;
  const SLING_WX=110, SLING_WY=GROUND_Y-60; // sling in world-space

  // camera: camX is the world-x that maps to view x=0
  let camX=0, camTargetX=0;

  function toScreen(wx){ return wx - camX; }
  function toWorld(sx){ return sx + camX; }

  // ── Level generator — towers grow taller each level ──────────────
  const GY = GROUND_Y;

  // Build a tower: cols wide, rows tall, starting at world-x ox, brick size s, hp value
  function makeTower(ox, cols, rows, s, hp) {
    const pad = 2, targets = [];
    for (let r = 0; r < rows; r++) {
      const rowCols = Math.max(1, cols - r); // taper toward top
      const rowX = ox + r * (s + pad) / 2;  // center each row
      for (let c = 0; c < rowCols; c++) {
        targets.push({
          x: rowX + c * (s + pad),
          y: GY - (r + 1) * s - r * pad,  // y = top edge of brick
          w: s, h: s, hp, maxHp: hp
        });
      }
    }
    return targets;
  }

  // Generate level config: each level adds +2 rows to tower height
  function buildLevel(lvl) {
    const baseRows = 3;          // level 1 starts at 3 rows tall
    const rows = baseRows + (lvl - 1) * 2;  // +2 rows per level
    const balls = 4 + lvl;       // more balls as towers grow
    const s = 26;                // brick size
    const pad = 3;
    // Number of towers: 1 at lvl1, 2 at lvl2, 3 at lvl3+
    const numTowers = Math.min(lvl, 3);
    const spacing = numTowers === 1 ? 0 : numTowers === 2 ? 200 : 160;
    const baseX = numTowers === 1 ? 1310 : numTowers === 2 ? 1220 : 1160;
    let targets = [];
    for (let t = 0; t < numTowers; t++) {
      const ox = baseX + t * (spacing + (s + pad) * 3);
      const hp = Math.min(t + 1, 3);  // left=1hp, mid=2hp, right=3hp
      targets = targets.concat(makeTower(ox, 4, rows, s, hp));
    }
    return { balls, targets };
  }

  // Pre-build 5 levels (infinite loop beyond that reuses last pattern + more rows)
  function getLevelCfg(lvl) { return buildLevel(lvl); }

  // ── DOM ──────────────────────────────────────────────────────
  const canvas=document.getElementById('c');
  const ctx=canvas.getContext('2d');
  canvas.width=VW; canvas.height=VH;
  const scoreEl=document.getElementById('score-val');
  const ballsEl=document.getElementById('balls-val');
  const levelEl=document.getElementById('level-val');
  const overlay=document.getElementById('overlay');
  const ovIcon=overlay.querySelector('.ov-icon');
  const ovTitle=overlay.querySelector('.ov-title');
  const ovSub=document.getElementById('ov-sub');
  const toast=document.getElementById('toast');
  let toastTimer=null;

  // ── State ────────────────────────────────────────────────────
  let score,ballsLeft,level,running,loopId;
  let targets=[],particles=[],trails=[];
  let ball=null;
  let pulling=false,pullX=0,pullY=0;
  let settling=false,settleTimer=0;

  // ── Toast ────────────────────────────────────────────────────
  function showToast(msg,color){
    toast.textContent=msg; toast.style.color=color;
    toast.style.border='1px solid '+color;
    toast.style.background=color+'22';
    toast.style.textShadow='0 0 8px '+color;
    toast.classList.add('show');
    if(toastTimer)clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.classList.remove('show'),1600);
  }

  // ── Camera ───────────────────────────────────────────────────
  function updateCamera(){
    const LERP=0.06;
    // While pulling / idle: show slingshot
    if(!ball||!ball.flying){
      camTargetX=0;
    } else if(ball.flying){
      // Follow ball, keep it centered-ish
      camTargetX=ball.x - VW*0.35;
    }
    camTargetX=Math.max(0, Math.min(WORLD_W-VW, camTargetX));
    camX+=(camTargetX-camX)*LERP;
  }

  // ── Init ─────────────────────────────────────────────────────
  function initLevel(){
    const cfg=getLevelCfg(level);
    targets=cfg.targets.map(t=>({
      x:t.x, y:t.y, w:t.w, h:t.h, hp:t.hp, maxHp:t.hp,
      vx:0, vy:0, flash:0,
    }));
    ballsLeft=cfg.balls;
    particles=[]; trails=[];
    camX=0; camTargetX=0;
    resetBall();
    updateHUD();
  }

  function startGame(){
    score=0; level=1;
    scoreEl.textContent=0; levelEl.textContent=1;
    initLevel();
    overlay.className='ov-start hidden'; ovSub.style.display='none';
    running=true;
    if(loopId)cancelAnimationFrame(loopId);
    loopId=requestAnimationFrame(gameLoop);
  }

  function resetBall(){
    ball={x:SLING_WX,y:SLING_WY,vx:0,vy:0,r:BALL_R,flying:false,settled:false};
    pulling=false; settling=false; settleTimer=0;
    // Snap cam back
    camTargetX=0;
  }

  function updateHUD(){
    ballsEl.textContent='●'.repeat(Math.max(0,ballsLeft));
    scoreEl.textContent=score;
    levelEl.textContent=level;
  }

  // ── Particles ────────────────────────────────────────────────
  function spawnHit(x,y,color){
    for(let i=0;i<16;i++){
      const a=Math.random()*Math.PI*2,sp=2+Math.random()*5;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,color,size:2+Math.random()*4});
    }
  }
  function spawnDust(x,y){
    for(let i=0;i<8;i++){
      const a=Math.PI+Math.random()*Math.PI,sp=1+Math.random()*3;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:0.7,color:'#cc8844',size:2+Math.random()*3});
    }
  }

  // ── Physics ──────────────────────────────────────────────────
  function updateBall(){
    if(!ball.flying)return;

    // Trail (world coords stored)
    trails.push({x:ball.x,y:ball.y,life:1});
    if(trails.length>24)trails.shift();

    ball.vy+=GRAVITY;
    ball.x+=ball.vx;
    ball.y+=ball.vy;

    // Ground
    if(ball.y+ball.r>=GROUND_Y){
      ball.y=GROUND_Y-ball.r;
      ball.vy*=-BOUNCE;
      ball.vx*=FRICTION;
      spawnDust(ball.x,GROUND_Y);
      if(Math.abs(ball.vy)<0.8)ball.vy=0;
      if(Math.abs(ball.vx)<0.3&&Math.abs(ball.vy)<0.5)ball.settled=true;
    }
    // World walls
    if(ball.x-ball.r<0){ball.x=ball.r;ball.vx*=-BOUNCE;}
    if(ball.x+ball.r>WORLD_W){ball.x=WORLD_W-ball.r;ball.vx*=-BOUNCE;}
    if(ball.y-ball.r<0){ball.y=ball.r;ball.vy*=-BOUNCE;}

    // Target collisions
    targets.forEach(t=>{
      if(t.hp<=0)return;
      if(ball.x+ball.r>t.x&&ball.x-ball.r<t.x+t.w&&ball.y+ball.r>t.y&&ball.y-ball.r<t.y+t.h){
        const cx=t.x+t.w/2,cy=t.y+t.h/2;
        const dx=ball.x-cx,dy=ball.y-cy;
        if(Math.abs(dx)/t.w>Math.abs(dy)/t.h)ball.vx=Math.abs(ball.vx)*(dx>0?1:-1);
        else ball.vy=Math.abs(ball.vy)*(dy>0?1:-1);
        t.vx+=ball.vx*0.35;
        t.vy+=Math.min(ball.vy*0.35,-1.5);
        t.hp--; t.flash=6;
        const pts=t.maxHp===1?10:t.maxHp===2?25:50;
        score+=pts; updateHUD();
        const cols=['#00ffe7','#ffe600','#ff00cc'];
        spawnHit(cx,cy,cols[Math.min(t.maxHp-1,2)]);
        if(t.hp<=0)showToast('+'+pts*2+' DESTROYED!','#ffe600');
      }
    });
  }

  function updateTargets(){
    targets.forEach(t=>{
      if(t.hp<=0)return;
      t.vy+=GRAVITY*0.9;
      t.x+=t.vx; t.y+=t.vy;
      t.vx*=0.88;
      if(t.y+t.h>=GROUND_Y){t.y=GROUND_Y-t.h;t.vy*=-0.28;t.vx*=FRICTION;if(Math.abs(t.vy)<0.8)t.vy=0;}
      if(t.x<0){t.x=0;t.vx*=-0.4;}
      if(t.x+t.w>WORLD_W){t.x=WORLD_W-t.w;t.vx*=-0.4;}
      if(t.flash>0)t.flash--;
    });
  }

  function updateParticles(){
    particles=particles.filter(p=>p.life>0);
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=0.035;});
    trails=trails.filter(t=>t.life>0);
    trails.forEach(t=>t.life-=0.06);
  }

  // ── Draw ─────────────────────────────────────────────────────
  function draw(){
    ctx.fillStyle='#0a0010'; ctx.fillRect(0,0,VW,VH);

    // Draw world content with camera offset
    ctx.save();
    ctx.translate(-camX,0);

    drawWorld();
    drawSlingshot();
    drawAimGuide();
    drawTargets();
    drawBall();
    drawParticles();

    ctx.restore();

    // UI drawn in screen space (no translate)
    drawHUD();

    // Neon border
    ctx.save();
    ctx.strokeStyle='#ff00cc'; ctx.lineWidth=2;
    ctx.shadowColor='#ff00cc'; ctx.shadowBlur=20;
    ctx.strokeRect(1,1,VW-2,VH-2);
    ctx.restore();
  }

  function drawWorld(){
    // Parallax star dots far BG (static, subtle)
    ctx.fillStyle='rgba(255,255,255,0.06)';
    // Deterministic stars based on seed
    for(let i=0;i<80;i++){
      const sx=((i*337)%WORLD_W), sy=((i*179)%(GROUND_Y-20));
      ctx.fillRect(sx,sy,1,1);
    }

    // Distant neon city silhouette (decorative)
    ctx.fillStyle='rgba(255,0,200,0.06)';
    const buildings=[
      [600,80],[640,50],[680,70],[730,40],[780,60],[850,30],[920,55],[980,45],
      [1050,70],[1100,35],[1160,60],[1250,25],[1350,50],[1450,40],[1550,65],[1650,30],[1720,55]
    ];
    buildings.forEach(([bx,bh])=>{
      ctx.fillRect(bx,GROUND_Y-bh,30,bh);
    });

    // Grid lines on ground
    ctx.strokeStyle='rgba(255,0,200,0.04)'; ctx.lineWidth=0.5;
    for(let x=0;x<=WORLD_W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,VH);ctx.stroke();}
    for(let y=0;y<=VH;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD_W,y);ctx.stroke();}

    // Ground line
    ctx.save();
    ctx.shadowColor='#ff00cc'; ctx.shadowBlur=10;
    ctx.strokeStyle='#ff00cc66'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(WORLD_W,GROUND_Y); ctx.stroke();
    const gg=ctx.createLinearGradient(0,GROUND_Y,0,VH);
    gg.addColorStop(0,'rgba(255,0,200,0.1)'); gg.addColorStop(1,'rgba(255,0,200,0)');
    ctx.fillStyle=gg; ctx.fillRect(0,GROUND_Y,WORLD_W,VH-GROUND_Y);
    ctx.restore();

    // Distance marker arrow pointing to targets (only when cam near sling)
    if(camX<200 && (!ball||!ball.flying)){
      ctx.save();
      ctx.globalAlpha=0.5+0.3*Math.sin(Date.now()/400);
      ctx.fillStyle='#ffe600'; ctx.strokeStyle='#ffe600';
      ctx.shadowColor='#ffe600'; ctx.shadowBlur=12;
      ctx.font='bold 12px Courier New'; ctx.textAlign='center';
      ctx.fillText('TARGET ▶▶▶', VW*0.75+camX, GROUND_Y-16);
      ctx.restore();
    }
  }

  function drawSlingshot(){
    const fx=SLING_WX, fy=SLING_WY;
    ctx.save();
    ctx.strokeStyle='#cc8840'; ctx.lineWidth=7; ctx.lineCap='round';
    ctx.shadowColor='#ff8800'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.moveTo(fx,GROUND_Y); ctx.lineTo(fx-12,fy-14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx,GROUND_Y); ctx.lineTo(fx+12,fy-14); ctx.stroke();
    ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(fx-12,fy-14); ctx.lineTo(fx-22,fy-32); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx+12,fy-14); ctx.lineTo(fx+22,fy-32); ctx.stroke();
    // Elastic bands
    if(!ball.flying&&!ball.settled){
      const bx=pulling?pullX:ball.x, by=pulling?pullY:ball.y;
      ctx.lineWidth=3; ctx.shadowColor='#ffe600'; ctx.shadowBlur=10; ctx.strokeStyle='#ffe600';
      ctx.beginPath(); ctx.moveTo(fx-22,fy-32); ctx.lineTo(bx,by); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx+22,fy-32); ctx.lineTo(bx,by); ctx.stroke();
    }
    ctx.restore();
  }

  function drawAimGuide(){
    if(!pulling||ball.flying)return;
    const dx=SLING_WX-pullX, dy=SLING_WY-pullY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const power=Math.min(dist/MAX_PULL,1);
    const vx=dx*0.18*power*2, vy=dy*0.18*power*2;
    let px=pullX,py=pullY,pvx=vx,pvy=vy;
    ctx.save();
    for(let i=0;i<32;i++){
      pvy+=GRAVITY; px+=pvx; py+=pvy;
      if(py>GROUND_Y)break;
      ctx.globalAlpha=(1-i/32)*0.5;
      ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(px,py,2,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    const ang=Math.atan2(dy,dx);
    ctx.strokeStyle=`hsl(${120-power*120},100%,60%)`;
    ctx.lineWidth=2; ctx.shadowColor=ctx.strokeStyle; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(SLING_WX,SLING_WY,MAX_PULL,ang-0.3,ang+0.3); ctx.stroke();
    ctx.restore();
  }

  function drawTargets(){
    targets.forEach(t=>{
      if(t.hp<=0)return;
      const ratio=t.hp/t.maxHp;
      let color=t.maxHp===1?'#00ffe7':t.maxHp===2?'#ffe600':'#ff00cc';
      const flash=t.flash>0;
      ctx.save();
      ctx.shadowColor=flash?'#fff':color; ctx.shadowBlur=flash?28:10;
      ctx.fillStyle=flash?'#ffffff':color;
      roundRect(t.x,t.y,t.w,t.h,4); ctx.fill();
      // Cracks
      if(ratio<1){
        ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(t.x+t.w*0.3,t.y); ctx.lineTo(t.x+t.w*0.5,t.y+t.h*0.7);
        ctx.moveTo(t.x+t.w*0.7,t.y+t.h*0.15); ctx.lineTo(t.x+t.w*0.35,t.y+t.h);
        ctx.stroke();
      }
      // Shine
      const shine=ctx.createLinearGradient(t.x,t.y,t.x,t.y+t.h);
      shine.addColorStop(0,'rgba(255,255,255,0.3)'); shine.addColorStop(0.5,'rgba(255,255,255,0)');
      ctx.fillStyle=shine; roundRect(t.x,t.y,t.w,t.h/2,4); ctx.fill();
      // HP pips
      if(t.maxHp>1){
        for(let i=0;i<t.maxHp;i++){
          ctx.fillStyle=i<t.hp?color:'#33002288';
          ctx.beginPath(); ctx.arc(t.x+6+i*8,t.y+t.h-6,2.5,0,Math.PI*2); ctx.fill();
        }
      }
      ctx.restore();
    });
  }

  function drawBall(){
    if(!ball)return;
    const bx=pulling&&!ball.flying?pullX:ball.x;
    const by=pulling&&!ball.flying?pullY:ball.y;
    // Trails
    if(ball.flying){
      trails.forEach(tr=>{
        ctx.save(); ctx.globalAlpha=tr.life*0.4;
        ctx.fillStyle='#ff00cc';
        ctx.beginPath(); ctx.arc(tr.x,tr.y,Math.max(0,BALL_R*(tr.life*0.8)),0,Math.PI*2); ctx.fill();
        ctx.restore();
      });
    }
    ctx.save();
    ctx.shadowColor='#ff00cc'; ctx.shadowBlur=22;
    const bg=ctx.createRadialGradient(bx-3,by-3,1,bx,by,BALL_R);
    bg.addColorStop(0,'#ffffff'); bg.addColorStop(0.35,'#ff66dd'); bg.addColorStop(1,'#aa0088');
    ctx.fillStyle=bg;
    ctx.beginPath(); ctx.arc(bx,by,BALL_R,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawParticles(){
    particles.forEach(p=>{
      ctx.save(); ctx.globalAlpha=p.life;
      ctx.shadowColor=p.color; ctx.shadowBlur=8; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0,p.size*p.life),0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
  }

  function drawHUD(){
    // Bottom hint (screen space)
    if(running){
      ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.font='11px Courier New'; ctx.textAlign='center';
      if(!ball.flying&&!ball.settled) ctx.fillText(pulling?'RELEASE TO FIRE!':'DRAG BALL TO AIM',VW/2,VH-8);
      if(ball.settled) ctx.fillText('NEXT BALL...',VW/2,VH-8);
    }

    // Mini-map strip at top showing whole world
    const mmW=VW, mmH=8, mmY=0;
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,mmY,mmW,mmH);
    // Viewport indicator
    const vpX=(camX/WORLD_W)*mmW, vpW=(VW/WORLD_W)*mmW;
    ctx.fillStyle='rgba(255,0,200,0.4)'; ctx.fillRect(vpX,mmY,vpW,mmH);
    // Sling dot
    ctx.fillStyle='#ff00cc'; ctx.fillRect((SLING_WX/WORLD_W)*mmW-1,mmY,3,mmH);
    // Target dots
    ctx.fillStyle='#ffe600';
    targets.forEach(t=>{ if(t.hp>0) ctx.fillRect((t.x/WORLD_W)*mmW,mmY+2,2,mmH-4); });
    // Ball dot
    if(ball){
      ctx.fillStyle='#ffffff'; ctx.fillRect((ball.x/WORLD_W)*mmW-1,mmY,3,mmH);
    }
  }

  // ── Game Loop ────────────────────────────────────────────────
  function gameLoop(){
    if(!running)return;
    updateCamera();
    update();
    draw();
    loopId=requestAnimationFrame(gameLoop);
  }

  function update(){
    updateParticles();
    updateBall();
    updateTargets();

    if(ball.flying&&ball.settled&&!settling){
      settling=true; settleTimer=80;
    }
    if(settling){
      settleTimer--;
      if(settleTimer<=0){
        settling=false;
        ballsLeft--;
        updateHUD();
        if(targets.every(t=>t.hp<=0)){levelWin();return;}
        if(ballsLeft<=0){
          running=false;
          overlay.className='ov-dead';
          ovIcon.textContent='💀'; ovTitle.textContent='OUT OF AMMO';
          ovSub.textContent='Score: '+score; ovSub.style.display='block';
          overlay.classList.remove('hidden');
          return;
        }
        resetBall();
      }
    }
    if(ball.flying&&targets.every(t=>t.hp<=0)){levelWin();}
  }

  function levelWin(){
    const bonus=ballsLeft*50;
    score+=bonus; updateHUD();
    running=false;
    if(level>=LEVELS.length){
      overlay.className='ov-win';
      ovIcon.textContent='🏆'; ovTitle.textContent='YOU WIN!';
      ovSub.textContent='Final Score: '+score; ovSub.style.display='block';
      overlay.classList.remove('hidden');
    } else {
      overlay.className='ov-win';
      ovIcon.textContent='🎯'; ovTitle.textContent='LEVEL CLEAR!';
      ovSub.textContent='+'+bonus+' BONUS!'; ovSub.style.display='block';
      overlay.classList.remove('hidden');
      setTimeout(()=>{
        level++; levelEl.textContent=level;
        initLevel();
        overlay.classList.add('hidden');
        running=true;
        loopId=requestAnimationFrame(gameLoop);
      },2000);
    }
  }

  // ── Input ────────────────────────────────────────────────────
  function getWorldPos(clientX,clientY){
    const rect=canvas.getBoundingClientRect();
    const sx=(clientX-rect.left)*(VW/rect.width);
    const sy=(clientY-rect.top)*(VH/rect.height);
    return {x:sx+camX, y:sy};
  }

  function onDown(cx,cy){
    if(!running)return;
    const pos=getWorldPos(cx,cy);
    if(ball.flying||ball.settled)return;
    const dx=pos.x-ball.x,dy=pos.y-ball.y;
    if(Math.sqrt(dx*dx+dy*dy)<BALL_R+22){
      pulling=true;
      constrainPull(pos.x,pos.y);
    }
  }

  function onMove(cx,cy){
    if(!pulling||!running)return;
    const pos=getWorldPos(cx,cy);
    constrainPull(pos.x,pos.y);
  }

  function constrainPull(x,y){
    const dx=x-SLING_WX,dy=y-SLING_WY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>MAX_PULL){pullX=SLING_WX+dx/dist*MAX_PULL;pullY=SLING_WY+dy/dist*MAX_PULL;}
    else{pullX=x;pullY=y;}
    if(pullX>SLING_WX+20)pullX=SLING_WX+20;
  }

  function onUp(){
    if(!pulling||!running)return;
    const dx=SLING_WX-pullX,dy=SLING_WY-pullY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<8){pulling=false;resetBall();return;}
    const power=Math.min(dist/MAX_PULL,1);
    ball.x=pullX; ball.y=pullY;
    ball.vx=dx*0.18*power*2;
    ball.vy=dy*0.18*power*2;
    ball.flying=true; pulling=false;
  }

  overlay.addEventListener('click',()=>{if(!running)startGame();});
  canvas.addEventListener('mousedown',e=>onDown(e.clientX,e.clientY));
  canvas.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
  canvas.addEventListener('mouseup',onUp);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();onDown(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  canvas.addEventListener('touchmove', e=>{e.preventDefault();onMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  canvas.addEventListener('touchend', e=>{e.preventDefault();onUp();},{passive:false});

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath();
  }

  // Initial preview draw
  camX=0; score=0; level=1; ballsLeft=5; particles=[]; trails=[];
  targets=getLevelCfg(1).targets.map(t=>({x:t.x,y:t.y,w:t.w,h:t.h,hp:t.hp,maxHp:t.hp,vx:0,vy:0,flash:0}));
  ball={x:SLING_WX,y:SLING_WY,vx:0,vy:0,r:BALL_R,flying:false,settled:false};
  draw();
})();
</script>
</body>
</html>
