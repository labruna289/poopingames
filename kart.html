<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kart Race — Poopi Games</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 44px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; padding: 0 20px; gap: 20px;
  }
  .nav-back {
    font-size: 0.8rem; color: #00f5ff; text-decoration: none;
    display: flex; align-items: center; gap: 5px; transition: opacity 0.2s;
  }
  .nav-back:hover { opacity: 0.7; }
  .nav-title { font-size: 0.9rem; font-weight: 600; }
  #game-wrapper {
    position: fixed; inset: 44px 0 0 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  canvas { display: block; cursor: none; }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.82); backdrop-filter: blur(8px);
    gap: 14px; z-index: 10;
  }
  #overlay.hidden { display: none; }
  .ov-eyebrow { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #ffe600; }
  .ov-title { font-size: clamp(2rem,6vw,3.5rem); font-weight: 700; letter-spacing: -0.03em; text-shadow: 0 0 40px #ffe600; }
  .ov-sub { font-size: 0.9rem; color: rgba(255,255,255,0.5); text-align: center; max-width: 360px; line-height: 1.55; }
  .btn {
    margin-top: 6px; padding: 13px 36px;
    background: #ffe600; color: #000;
    font-size: 0.95rem; font-weight: 700; border: none; border-radius: 100px;
    cursor: pointer; box-shadow: 0 0 24px #ffe600;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform: scale(1.04); box-shadow: 0 0 40px #ffe600; }
  .score-result { font-size: 1.1rem; color: rgba(255,255,255,0.7); }
  .score-result span { color: #fff; font-weight: 700; }
</style>
</head>
<body>

<nav>
  <a class="nav-back" href="index.html">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Games
  </a>
  <span class="nav-title">Kart Race</span>
</nav>

<div id="game-wrapper">
  <canvas id="c"></canvas>
  <div id="overlay">
    <p class="ov-eyebrow">Arcade Racer</p>
    <h1 class="ov-title">Kart Race</h1>
    <p class="ov-sub">
      <strong>Arrows / WASD</strong> to drive &nbsp;·&nbsp; <strong>Space</strong> to drift<br>
      Hold drift through a corner, then release for a <strong>boost</strong>.<br>
      First to finish 3 laps wins.
    </p>
    <button class="btn" id="start-btn">Race!</button>
  </div>
</div>

<script>
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start-btn');

const W = 900, H = 600;
function resize() {
  const wrap = document.getElementById('game-wrapper');
  const s = Math.min(wrap.clientWidth / W, wrap.clientHeight / H, 1);
  canvas.style.width  = W * s + 'px';
  canvas.style.height = H * s + 'px';
  canvas.width  = W;
  canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// ─── Camera / projection constants ───────────────────────────────────────────
const FOCAL      = 300;   // perspective focal length
const CAM_BACK   = 105;   // distance behind kart
const CAM_UP     = 50;    // camera height above ground
const CAM_PITCH  = 0.20;  // tilt down (rad)
const CAM_LERP   = 0.10;  // how quickly camera follows

// ─── Track ───────────────────────────────────────────────────────────────────
const N      = 72;     // number of segments
const ROAD_W = 88;     // road half-width

// Build a slightly squished ellipse
const track = [];
for (let i = 0; i < N; i++) {
  const t = (i / N) * Math.PI * 2;
  track.push({ x: Math.cos(t) * 680, z: Math.sin(t) * 360 });
}
// Compute tangent, left-normal, and road edge points
for (let i = 0; i < N; i++) {
  const p = track[(i - 1 + N) % N];
  const n = track[(i + 1) % N];
  let tx = n.x - p.x, tz = n.z - p.z;
  const len = Math.hypot(tx, tz);
  tx /= len; tz /= len;
  const nx = -tz, nz = tx;   // left normal
  Object.assign(track[i], {
    tx, tz, nx, nz,
    lx: track[i].x + nx * ROAD_W, lz: track[i].z + nz * ROAD_W,
    rx: track[i].x - nx * ROAD_W, rz: track[i].z - nz * ROAD_W,
  });
}

// ─── Physics constants ───────────────────────────────────────────────────────
const MAX_SPEED      = 9.5;
const BOOST_SPEED    = 14.5;
const ACCEL          = 0.18;
const BRAKE_FORCE    = 0.30;
const COAST          = 0.985;   // speed decay when not pressing gas/brake
const FRICTION       = 0.968;   // per-frame speed multiplier
const OFFROAD_MUL    = 0.84;    // extra friction off-road
const TURN_RATE      = 0.047;   // rad/frame
// Velocity lags behind heading — this IS the drift feel
const ALIGN_NORMAL   = 0.13;    // fast alignment = responsive
const ALIGN_DRIFT    = 0.020;   // slow alignment = pronounced CTR-style slide
const JUMP_V         = 3.5;     // initial vertical velocity on jump
const GRAVITY        = 0.18;    // downward pull per frame

const TOTAL_LAPS = 3;

// ─── Camera state ────────────────────────────────────────────────────────────
const cam = { x: 0, y: CAM_UP, z: 0, yaw: 0 };

const cosPitch = Math.cos(CAM_PITCH);
const sinPitch = Math.sin(CAM_PITCH);

function updateCam(kart) {
  // Target: CAM_BACK units behind kart, CAM_UP above ground
  const tx = kart.x - Math.sin(kart.angle) * CAM_BACK;
  const tz = kart.z - Math.cos(kart.angle) * CAM_BACK;
  cam.x += (tx    - cam.x) * CAM_LERP;
  cam.z += (tz    - cam.z) * CAM_LERP;
  cam.y += (CAM_UP - cam.y) * CAM_LERP;
  cam.yaw = lerpAngle(cam.yaw, kart.angle, CAM_LERP);
}

// ─── 3-D projection ──────────────────────────────────────────────────────────
// World axes: X=right, Y=up, Z=forward.  Kart at y=0.
function project(wx, wy, wz) {
  // Translate to camera-relative
  let dx = wx - cam.x;
  let dy = cam.y - wy;   // positive = below camera (screen Y goes down)
  let dz = wz - cam.z;

  // Rotate by -cam.yaw around Y (align camera facing with +Z)
  const cy = Math.cos(-cam.yaw), sy = Math.sin(-cam.yaw);
  const rx = cy * dx + sy * dz;
  const rz = -sy * dx + cy * dz;

  // Rotate by cam.pitch around X (tilt camera down)
  const finalY = cosPitch * dy - sinPitch * rz;
  const finalZ = sinPitch * dy + cosPitch * rz;

  if (finalZ < 0.5) return null;
  const s = FOCAL / finalZ;
  return { sx: W / 2 + rx * s, sy: H / 2 + finalY * s, s, depth: finalZ };
}

// ─── Kart class ───────────────────────────────────────────────────────────────
class Kart {
  constructor(segIdx, laneOffset, color) {
    const seg = track[segIdx % N];
    this.x     = seg.x + seg.nx * laneOffset * 22;
    this.z     = seg.z + seg.nz * laneOffset * 22;
    this.angle = Math.atan2(seg.tx, seg.tz); // heading (0 = +Z world)
    this.speed = 0;
    this.vx    = 0;   // actual velocity X
    this.vz    = 0;   // actual velocity Z
    this.steer = 0;   // smoothed steer input (-1..1)

    // Drift state
    this.drifting    = false;
    this.driftDir    = 1;
    this.driftCharge = 0;   // 0..1
    this.boosting    = 0;   // frames remaining

    // Race state
    this.seg      = segIdx % N;
    this.prevSeg  = segIdx % N;
    this.lap      = 0;
    this.finished = false;
    this.rank     = 0;

    // Jump state
    this.y        = 0;    // height above ground
    this.vy       = 0;    // vertical velocity
    this.prevJump = false;

    this.color = color;
  }

  update(gas, brk, steerIn, driftBtn, jumpBtn) {
    if (this.finished) { this.speed *= 0.92; return; }

    // ── Speed ──
    const maxNow = this.boosting > 0 ? BOOST_SPEED : MAX_SPEED;
    if (this.boosting > 0) this.boosting--;

    if (gas)      this.speed = Math.min(this.speed + ACCEL, maxNow);
    else if (brk) this.speed = Math.max(this.speed - BRAKE_FORCE, -MAX_SPEED * 0.3);
    else          this.speed *= COAST;

    this.speed *= FRICTION;
    if (!onTrack(this.x, this.z)) this.speed *= OFFROAD_MUL;

    // ── Steer smoothing ──
    this.steer += (steerIn - this.steer) * 0.22;

    // ── Drift start / end ──
    const absSp = Math.abs(this.speed);
    if (driftBtn && absSp > 1.5 && !this.drifting) {
      this.drifting    = true;
      this.driftDir    = this.steer >= 0 ? 1 : -1;
      this.driftCharge = 0;
    }
    if (!driftBtn || absSp < 0.5) {
      if (this.drifting && this.driftCharge > 0.25) this.boosting = 50;
      this.drifting    = false;
      this.driftCharge = 0;
    }

    // ── Heading rotation ──
    // Turn rate proportional to speed (more grip at low speed → tighter turns)
    const tr = TURN_RATE * (0.35 + 0.65 * absSp / MAX_SPEED);
    if (this.drifting) {
      // CTR-style: always arc in drift direction; steering adjusts tightness.
      // steer in drift dir → tight arc; counter-steer → wide/straight arc.
      const steerFactor = Math.max(0, 0.3 + 0.7 * (this.driftDir * this.steer));
      this.angle += this.driftDir * tr * 2.0 * steerFactor;
      this.driftCharge = Math.min(this.driftCharge + 0.009, 1);
    } else {
      this.angle += this.steer * tr * Math.sign(this.speed);
    }

    // ── Jump ──
    if (jumpBtn && !this.prevJump && this.y <= 0.1) {
      this.vy = JUMP_V;
    }
    this.prevJump = jumpBtn;
    this.vy -= GRAVITY;
    this.y   = Math.max(0, this.y + this.vy);
    if (this.y <= 0) this.vy = 0;

    // ── Velocity lags heading — this creates the slide feel ──
    // In CTR, the kart "goes where you point it" in normal mode but slides in drift.
    const align = this.drifting ? ALIGN_DRIFT : ALIGN_NORMAL;
    this.vx += (Math.sin(this.angle) * this.speed - this.vx) * align;
    this.vz += (Math.cos(this.angle) * this.speed - this.vz) * align;

    this.x += this.vx;
    this.z += this.vz;

    // ── Lap counting ──
    const ns = nearestSeg(this.x, this.z);
    if (this.prevSeg > N * 0.85 && ns < N * 0.15) {
      this.lap++;
      if (this.lap >= TOTAL_LAPS) this.finished = true;
    }
    this.prevSeg = this.seg;
    this.seg     = ns;
  }

  // Effective race progress (for position ranking)
  progress() { return this.lap * N + this.seg; }
}

// ─── Track helpers ────────────────────────────────────────────────────────────
function nearestSeg(x, z) {
  let best = 0, bestD = Infinity;
  for (let i = 0; i < N; i++) {
    const d = (x - track[i].x) ** 2 + (z - track[i].z) ** 2;
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

function onTrack(x, z) {
  const t = track[nearestSeg(x, z)];
  return Math.abs((x - t.x) * t.nx + (z - t.z) * t.nz) < ROAD_W * 1.08;
}

// ─── Input ────────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((e.key === ' ' || e.key === 'Enter') && state !== 'playing') startGame();
  if (e.key === ' ') e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.key] = false);

// ─── Game state ───────────────────────────────────────────────────────────────
let state = 'idle';
let player, bots, frame, finishOrder, particles;
let loopRunning = false;

startBtn.addEventListener('click', startGame);

function startGame() {
  overlay.classList.add('hidden');
  player = new Kart(0,  0, '#00f5ff');
  bots   = [
    new Kart(N - 2, -1, '#ff006e'),
    new Kart(N - 4,  1, '#ffe600'),
  ];
  frame = 0;
  finishOrder = [];
  particles   = [];

  // Snap camera to starting position
  cam.x   = player.x - Math.sin(player.angle) * CAM_BACK;
  cam.z   = player.z - Math.cos(player.angle) * CAM_BACK;
  cam.y   = CAM_UP;
  cam.yaw = player.angle;

  state = 'playing';
  if (!loopRunning) startLoop();
}

// ─── AI ───────────────────────────────────────────────────────────────────────
const AI_LOOK = 7;  // segments ahead to aim at

function aiInput(kart) {
  const target = track[(kart.seg + AI_LOOK) % N];
  const dx = target.x - kart.x, dz = target.z - kart.z;
  const dist = Math.hypot(dx, dz);
  // Project target onto kart's right vector
  const steer = clamp((dx * Math.cos(kart.angle) - dz * Math.sin(kart.angle)) / dist * 2.8, -1, 1);
  return { gas: true, brk: false, steer, drift: Math.abs(steer) > 0.55 };
}

// ─── Kart collision ──────────────────────────────────────────────────────────
const KART_R = 24; // collision radius

function resolveCollisions() {
  const all = [player, ...bots];
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) {
      const a = all[i], b = all[j];
      const dx = b.x - a.x, dz = b.z - a.z;
      const dist = Math.hypot(dx, dz);
      if (dist < KART_R * 2 && dist > 0.01) {
        // Push the two karts apart so they don't overlap
        const nx = dx / dist, nz = dz / dist;
        const push = (KART_R * 2 - dist) * 0.5;
        a.x -= nx * push;  a.z -= nz * push;
        b.x += nx * push;  b.z += nz * push;

        // Velocity impulse along the collision normal
        const relVx = a.vx - b.vx, relVz = a.vz - b.vz;
        const dot = relVx * nx + relVz * nz;
        if (dot > 0) { // only when approaching
          const imp = dot * 0.65;
          a.vx -= nx * imp;  a.vz -= nz * imp;
          b.vx += nx * imp;  b.vz += nz * imp;
        }
      }
    }
  }
}

// ─── Update ──────────────────────────────────────────────────────────────────
function update() {
  if (state !== 'playing') return;
  frame++;

  const gas   = keys['ArrowUp']    || keys['w'] || keys['W'];
  const brk   = keys['ArrowDown']  || keys['s'] || keys['S'];
  const left  = keys['ArrowLeft']  || keys['a'] || keys['A'];
  const right = keys['ArrowRight'] || keys['d'] || keys['D'];
  const drift = keys['Shift'];
  const jump  = keys[' '];
  const steer = (right ? 1 : 0) - (left ? 1 : 0);

  player.update(gas, brk, steer, drift, jump);
  bots.forEach(b => {
    const ai = aiInput(b);
    b.update(ai.gas, ai.brk, ai.steer, ai.drift, false);
  });

  resolveCollisions();
  // Drift sparks only when on ground
  [player, ...bots].forEach(k => { if (k.drifting && k.y <= 0.1) spawnDriftSparks(k); });
  updateParticles();
  updateCam(player);

  // Track finish order
  [player, ...bots].forEach(k => {
    if (k.finished && !finishOrder.includes(k)) finishOrder.push(k);
  });

  if (player.finished) {
    const place = finishOrder.indexOf(player) + 1;
    state = 'over';
    const secs = (frame / 60).toFixed(1);
    showOverlay(
      place === 1 ? 'You Win!' : `P${place} Place`,
      `Time: <span>${secs}s</span>`,
      'Race Again'
    );
  }
}

// ─── Drift sparks ─────────────────────────────────────────────────────────────
function spawnDriftSparks(kart) {
  const ca = Math.cos(kart.angle), sa = Math.sin(kart.angle);
  // Spawn from each rear wheel (local x = ±hw, local z = -hl = rear)
  for (const lx of [-18, 18]) {
    const wx = kart.x + ca * lx + sa * -24;
    const wz = kart.z - sa * lx + ca * -24;
    const p  = project(wx, 2, wz);
    if (!p) continue;
    const col = kart.driftCharge > 0.5 ? '#ffe600' : '#ff6600';
    for (let i = 0; i < 2; i++) {
      particles.push({
        x: p.sx + (Math.random() - 0.5) * 5,
        y: p.sy + (Math.random() - 0.5) * 3,
        vx: (Math.random() - 0.5) * 2.5,
        vy: -0.4 - Math.random() * 1.2,
        life: 1.0,
        color: col,
        r: 2 + Math.random() * 2,
      });
    }
  }
}

function updateParticles() {
  particles.forEach(p => {
    p.x   += p.vx;
    p.y   += p.vy;
    p.vy  += 0.06;
    p.life -= 0.06;
  });
  particles = particles.filter(p => p.life > 0);
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life * 0.9;
    ctx.shadowColor = p.color;
    ctx.shadowBlur  = 6;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.restore();
  });
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawRoad();
  // Draw karts back-to-front
  const allKarts = [player, ...bots];
  allKarts
    .map(k => ({ k, p: project(k.x, k.y, k.z) }))
    .sort((a, b) => (b.p?.depth ?? 0) - (a.p?.depth ?? 0))
    .forEach(({ k }) => drawKart(k));
  drawParticles();
  drawHUD();
}

function drawSky() {
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.62);
  sky.addColorStop(0, '#060612');
  sky.addColorStop(1, '#0e1e30');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H * 0.62);
  // Off-road ground
  ctx.fillStyle = '#101808';
  ctx.fillRect(0, H * 0.56, W, H * 0.44);
}

function drawRoad() {
  // Draw segments back-to-front
  const camSeg = nearestSeg(cam.x, cam.z);
  const start  = (camSeg + Math.floor(N / 2)) % N;

  for (let k = 0; k < N; k++) {
    const i = (start + k) % N;
    const j = (i + 1) % N;
    const a = track[i], b = track[j];

    const al = project(a.lx, 0, a.lz);
    const ar = project(a.rx, 0, a.rz);
    const bl = project(b.lx, 0, b.lz);
    const br = project(b.rx, 0, b.rz);
    if (!al || !ar || !bl || !br) continue;

    // Road surface — alternate shade for visual rhythm
    ctx.beginPath();
    ctx.moveTo(al.sx, al.sy); ctx.lineTo(bl.sx, bl.sy);
    ctx.lineTo(br.sx, br.sy); ctx.lineTo(ar.sx, ar.sy);
    ctx.closePath();
    ctx.fillStyle = i % 2 === 0 ? '#3c3c3c' : '#383838';
    ctx.fill();

    // Curb stripes (alternating every 3 segments)
    const curbColor = Math.floor(i / 3) % 2 === 0 ? '#cc1133' : '#eeeeee';
    ctx.strokeStyle = curbColor;
    ctx.lineWidth   = 3.5;
    ctx.beginPath(); ctx.moveTo(al.sx, al.sy); ctx.lineTo(bl.sx, bl.sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ar.sx, ar.sy); ctx.lineTo(br.sx, br.sy); ctx.stroke();
  }

  // Start / finish line (segment 0 → 1)
  const a = track[0], b = track[1];
  const al = project(a.lx, 0, a.lz), ar = project(a.rx, 0, a.rz);
  const bl = project(b.lx, 0, b.lz), br = project(b.rx, 0, b.rz);
  if (al && ar && bl && br) {
    ctx.beginPath();
    ctx.moveTo(al.sx, al.sy); ctx.lineTo(bl.sx, bl.sy);
    ctx.lineTo(br.sx, br.sy); ctx.lineTo(ar.sx, ar.sy);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fill();
  }
}

// Draw kart as a 3-D box.
// Local axes: +Z = forward (kart nose), +X = right, +Y = up.
function drawKart(kart) {
  const hw = 20, hl = 26, h = 17; // half-width, half-length, height
  const ca = Math.cos(kart.angle), sa = Math.sin(kart.angle);

  // Optional lean while turning / drifting
  const lean = -kart.steer * 0.07 + (kart.drifting ? -kart.driftDir * 0.1 : 0);

  function wp(lx, ly, lz) {
    // Lean: tilt around Z — left side rises/falls; kart.y lifts on jump
    const leanedY = ly + kart.y + lean * lx;
    return project(
      kart.x + ca * lx + sa * lz,
      leanedY,
      kart.z - sa * lx + ca * lz
    );
  }

  // 8 box corners (front = +lz = kart nose, back = -lz = toward camera)
  const c = [
    wp(-hw, h,  hl), wp(hw, h,  hl), wp(hw, h, -hl), wp(-hw, h, -hl), // 0-3 top
    wp(-hw, 0,  hl), wp(hw, 0,  hl), wp(hw, 0, -hl), wp(-hw, 0, -hl), // 4-7 bottom
  ];

  // Faces: [corner indices, brightness factor]
  // Draw front first (farthest from camera) then sides then back then top
  const faces = [
    [[4, 5, 1, 0], 0.40],  // front
    [[4, 7, 3, 0], 0.65],  // left
    [[5, 6, 2, 1], 0.65],  // right
    [[7, 6, 2, 3], 1.00],  // back  (closest — brightest)
    [[0, 1, 2, 3], 0.80],  // top
  ];

  faces.forEach(([idx, bright]) => {
    const pts = idx.map(i => c[i]);
    if (pts.some(p => !p)) return;
    ctx.beginPath();
    ctx.moveTo(pts[0].sx, pts[0].sy);
    pts.slice(1).forEach(p => ctx.lineTo(p.sx, p.sy));
    ctx.closePath();
    ctx.fillStyle = tintColor(kart.color, bright);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth   = 0.6;
    ctx.stroke();
  });

  // Boost flash: cyan aura behind kart
  if (kart.boosting > 0) {
    const bt = kart.boosting / 50;
    const back = project(
      kart.x - Math.sin(kart.angle) * 30,
      5,
      kart.z - Math.cos(kart.angle) * 30
    );
    if (back) {
      const r = back.s * 28 * bt;
      const grd = ctx.createRadialGradient(back.sx, back.sy, 0, back.sx, back.sy, r);
      grd.addColorStop(0, `rgba(0,245,255,${bt * 0.9})`);
      grd.addColorStop(1, 'rgba(0,245,255,0)');
      ctx.beginPath();
      ctx.arc(back.sx, back.sy, r, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();
    }
  }
}

function drawHUD() {
  // Lap
  ctx.font         = '700 18px -apple-system, Arial';
  ctx.textBaseline = 'top';
  ctx.textAlign    = 'left';
  ctx.fillStyle    = '#fff';
  ctx.fillText(`LAP  ${Math.min(player.lap + 1, TOTAL_LAPS)} / ${TOTAL_LAPS}`, 16, 14);

  // Timer
  ctx.textAlign = 'right';
  ctx.fillText((frame / 60).toFixed(1) + 's', W - 16, 14);

  // Position
  const all = [player, ...bots].sort((a, b) => b.progress() - a.progress());
  const pos = all.indexOf(player) + 1;
  const labels = ['1st', '2nd', '3rd'];
  ctx.textAlign  = 'center';
  ctx.font       = '700 26px -apple-system, Arial';
  ctx.fillStyle  = pos === 1 ? '#ffe600' : '#fff';
  ctx.shadowColor = pos === 1 ? '#ffe600' : 'transparent';
  ctx.shadowBlur  = 12;
  ctx.fillText(labels[pos - 1] ?? `${pos}th`, W / 2, 12);
  ctx.shadowBlur = 0;

  // Speed bar
  const spd = Math.abs(player.speed) / MAX_SPEED;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(16, H - 22, 120, 8);
  ctx.fillStyle = player.boosting > 0 ? '#00f5ff' : '#ffe600';
  ctx.fillRect(16, H - 22, 120 * Math.min(spd * (player.boosting > 0 ? BOOST_SPEED / MAX_SPEED : 1), 1), 8);

  // Drift charge bar
  if (player.drifting) {
    const charge = player.driftCharge;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(W / 2 - 75, H - 28, 150, 10);
    ctx.fillStyle = charge > 0.55 ? '#ffe600' : '#ff7700';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 8;
    ctx.fillRect(W / 2 - 75, H - 28, 150 * charge, 10);
    ctx.shadowBlur = 0;
    ctx.font = '600 9px Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('BOOST CHARGE', W / 2, H - 14);
  }

  // Boost screen flash
  if (player.boosting > 0) {
    ctx.fillStyle = `rgba(0,245,255,${player.boosting / 50 * 0.12})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function lerpAngle(a, b, t) {
  let d = b - a;
  while (d >  Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

// Scale a hex color by a brightness factor 0..1
function tintColor(hex, f) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}

function showOverlay(title, body, btn) {
  overlay.innerHTML = `
    <p class="ov-eyebrow">Race finished</p>
    <h1 class="ov-title">${title}</h1>
    <p class="score-result">${body}</p>
    <button class="btn" id="start-btn">${btn}</button>`;
  overlay.classList.remove('hidden');
  document.getElementById('start-btn').addEventListener('click', startGame);
}

// ─── Loop ─────────────────────────────────────────────────────────────────────
function startLoop() {
  loopRunning = true;
  (function loop() {
    update();
    draw();
    if (state !== 'over') requestAnimationFrame(loop);
    else loopRunning = false;
  })();
}

draw(); // idle frame
</script>
