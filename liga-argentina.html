<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIGA ARGENTINA</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0010; min-height:100vh;
    font-family:'Courier New',monospace; color:#fff;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 20% 50%,rgba(0,200,100,0.08) 0%,transparent 60%),
      radial-gradient(ellipse at 80% 20%,rgba(255,220,0,0.08) 0%,transparent 60%),
      radial-gradient(ellipse at 60% 80%,rgba(0,100,255,0.06) 0%,transparent 60%);
    pointer-events:none; z-index:0;
  }
  body::after {
    content:''; position:fixed; inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.12) 3px,rgba(0,0,0,0.12) 4px);
    pointer-events:none; z-index:200;
  }

  #app { position:relative; z-index:10; max-width:900px; margin:0 auto; padding:24px 16px 40px; }

  /* NAV */
  #nav {
    display:flex; align-items:center; gap:16px; margin-bottom:28px;
  }
  #nav a {
    color:#0ff; text-decoration:none; font-size:12px; letter-spacing:2px;
    border:1px solid #0ff4; padding:6px 14px; transition:all .2s;
  }
  #nav a:hover { background:#0ff2; box-shadow:0 0 10px #0ff6; }
  #nav-sep { color:#444; }

  /* TITLE */
  #title-wrap { text-align:center; margin-bottom:32px; }
  #title {
    font-family:'Arial Black',sans-serif; font-size:38px; font-weight:900;
    letter-spacing:6px; line-height:1;
    background:linear-gradient(90deg,#75aadb,#fff,#f6b40e,#fff,#75aadb);
    background-size:200% auto;
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    animation:shine 4s linear infinite;
    text-shadow:none; filter:drop-shadow(0 0 18px #75aadb88);
  }
  @keyframes shine { to { background-position:200% center; } }
  #subtitle {
    margin-top:6px; font-size:12px; letter-spacing:4px; color:#888;
    text-transform:uppercase;
  }

  /* LAST UPDATED */
  #meta { text-align:center; font-size:11px; color:#555; letter-spacing:2px; margin-bottom:24px; }
  #meta span { color:#0a8; }

  /* TABS */
  #tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .tab {
    padding:7px 18px; font-family:'Courier New',monospace; font-size:12px;
    letter-spacing:2px; text-transform:uppercase; cursor:pointer;
    border:1px solid #333; background:transparent; color:#666;
    transition:all .2s;
  }
  .tab:hover { border-color:#0ff4; color:#0ff; }
  .tab.active { border-color:#0ff; color:#0ff; box-shadow:0 0 12px #0ff4; background:#0ff1; }

  /* STANDINGS TABLE */
  #standings-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th {
    padding:8px 10px; text-align:center; font-size:10px; letter-spacing:2px;
    color:#555; border-bottom:1px solid #1a1a2e; text-transform:uppercase;
  }
  thead th:first-child, thead th:nth-child(2) { text-align:left; }
  tbody tr {
    border-bottom:1px solid #111;
    transition:background .15s;
  }
  tbody tr:hover { background:rgba(255,255,255,0.03); }
  tbody td { padding:9px 10px; text-align:center; }
  tbody td:first-child { text-align:center; color:#555; font-size:11px; width:36px; }
  tbody td:nth-child(2) { text-align:left; }

  .team-cell { display:flex; align-items:center; gap:10px; }
  .team-logo { width:22px; height:22px; object-fit:contain; }
  .team-name { font-size:13px; letter-spacing:1px; }

  .pts { font-weight:700; color:#f6b40e; font-size:14px; }
  .gd { color:#888; }
  .gd.pos { color:#0c6; }
  .gd.neg { color:#c44; }

  /* Zone colors */
  tr.z-cl td:first-child { border-left:3px solid #0af; }
  tr.z-sul td:first-child { border-left:3px solid #0c6; }
  tr.z-rel td:first-child { border-left:3px solid #c44; }

  /* LEGEND */
  #legend { display:flex; gap:20px; margin-top:16px; flex-wrap:wrap; }
  .leg { display:flex; align-items:center; gap:6px; font-size:11px; color:#666; letter-spacing:1px; }
  .leg-dot { width:10px; height:10px; border-radius:50%; }

  /* SCORES */
  #scores-wrap { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .match-card {
    border:1px solid #1a1a2e; padding:14px 16px; background:#0d0d1a;
    transition:border-color .2s;
  }
  .match-card:hover { border-color:#f6b40e4a; }
  .match-date { font-size:10px; color:#555; letter-spacing:2px; margin-bottom:10px; text-transform:uppercase; }
  .match-teams { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .match-team { flex:1; }
  .match-team.home { text-align:right; }
  .match-team.away { text-align:left; }
  .match-team-name { font-size:12px; letter-spacing:1px; line-height:1.3; }
  .match-score-box { display:flex; align-items:center; gap:6px; padding:0 10px; }
  .match-score {
    font-size:20px; font-weight:700; color:#f6b40e; min-width:18px; text-align:center;
    text-shadow:0 0 12px #f6b40e88;
  }
  .match-score-sep { color:#444; font-size:16px; }
  .match-status { font-size:10px; text-align:center; margin-top:8px; letter-spacing:2px; }
  .status-live { color:#0c6; animation:blink 1s step-end infinite; }
  .status-ft { color:#555; }
  .status-sched { color:#446; }
  @keyframes blink { 50% { opacity:.3; } }

  /* LOADING / ERROR */
  #loading, #error {
    text-align:center; padding:60px 20px; font-size:13px; letter-spacing:3px;
    color:#555;
  }
  #error { color:#c44; }
  .spinner {
    display:inline-block; width:24px; height:24px;
    border:2px solid #222; border-top-color:#0ff;
    border-radius:50%; animation:spin .7s linear infinite;
    margin-bottom:16px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="app">

  <nav id="nav">
    <a href="arkanoid.html">&#9664; ARKANOID</a>
    <span id="nav-sep">|</span>
    <span style="color:#f6b40e;font-size:12px;letter-spacing:2px;">LIGA ARGENTINA</span>
  </nav>

  <div id="title-wrap">
    <div id="title">LIGA ARGENTINA</div>
    <div id="subtitle">Primera División · Temporada 2025</div>
  </div>

  <div id="meta">Datos via ESPN API &nbsp;·&nbsp; <span id="updated">cargando...</span></div>

  <div id="tabs">
    <button class="tab active" onclick="showTab('standings')">Tabla de Posiciones</button>
    <button class="tab" onclick="showTab('scores')">Resultados &amp; Fixtures</button>
  </div>

  <div id="standings-section">
    <div id="standings-loading"><div class="spinner"></div><br>Cargando tabla...</div>
    <div id="standings-error" style="display:none"></div>
    <div id="standings-wrap" style="display:none">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th>
            <th>GF</th><th>GC</th><th>DG</th><th>PTS</th>
          </tr>
        </thead>
        <tbody id="standings-body"></tbody>
      </table>
      <div id="legend">
        <div class="leg"><div class="leg-dot" style="background:#0af"></div> Copa Libertadores</div>
        <div class="leg"><div class="leg-dot" style="background:#0c6"></div> Copa Sudamericana</div>
        <div class="leg"><div class="leg-dot" style="background:#c44"></div> Descenso</div>
      </div>
    </div>
  </div>

  <div id="scores-section" style="display:none">
    <div id="scores-loading"><div class="spinner"></div><br>Cargando partidos...</div>
    <div id="scores-error" style="display:none"></div>
    <div id="scores-wrap" style="display:none"></div>
  </div>

</div>

<script>
const STANDINGS_URL = 'https://site.api.espn.com/apis/v2/sports/soccer/arg.1/standings';
const SCORES_URL    = 'https://site.api.espn.com/apis/v2/sports/soccer/arg.1/scoreboard';

let currentTab = 'standings';
let standingsLoaded = false;
let scoresLoaded = false;

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('standings-section').style.display = tab === 'standings' ? '' : 'none';
  document.getElementById('scores-section').style.display   = tab === 'scores'    ? '' : 'none';
  if (tab === 'scores' && !scoresLoaded) loadScores();
}

/* ── STANDINGS ── */
async function loadStandings() {
  try {
    const res = await fetch(STANDINGS_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderStandings(data);
    document.getElementById('updated').textContent = new Date().toLocaleString('es-AR');
  } catch(e) {
    document.getElementById('standings-loading').style.display = 'none';
    const el = document.getElementById('standings-error');
    el.style.display = '';
    el.innerHTML = `<div id="error">Error al cargar datos: ${e.message}<br><br><small>Intenta recargar la página.</small></div>`;
  }
}

function renderStandings(data) {
  document.getElementById('standings-loading').style.display = 'none';
  const wrap = document.getElementById('standings-wrap');
  wrap.style.display = '';
  const tbody = document.getElementById('standings-body');
  tbody.innerHTML = '';

  // ESPN standings structure
  const groups = data.children || data.standings?.groups || [];
  let entries = [];

  if (groups.length > 0) {
    // Try to find the main standings group
    for (const g of groups) {
      const rows = g.standings?.entries || g.entries || [];
      if (rows.length > entries.length) entries = rows;
    }
  }

  // Fallback: direct entries
  if (entries.length === 0) {
    entries = data.standings?.entries || data.entries || [];
  }

  if (entries.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#555;padding:30px">Sin datos disponibles</td></tr>';
    return;
  }

  const totalTeams = entries.length;

  entries.forEach((entry, i) => {
    const rank = i + 1;
    const team = entry.team || {};
    const logo = team.logos?.[0]?.href || team.logo || '';
    const name = team.shortDisplayName || team.displayName || team.name || '—';

    const stats = {};
    (entry.stats || []).forEach(s => { stats[s.name || s.abbreviation] = s.displayValue || s.value; });

    const gp  = stats['gamesPlayed']    || stats['GP']  || stats['games']         || '—';
    const w   = stats['wins']           || stats['W']   || '—';
    const d   = stats['ties']           || stats['D']   || stats['draws']          || '—';
    const l   = stats['losses']         || stats['L']   || '—';
    const gf  = stats['pointsFor']      || stats['GF']  || stats['goalsFor']       || '—';
    const gc  = stats['pointsAgainst']  || stats['GA']  || stats['goalsAgainst']   || '—';
    const gd  = stats['pointDifferential'] || stats['GD'] || stats['goalDifference'] || '—';
    const pts = stats['points']         || stats['PTS'] || stats['pts']            || '—';

    let gdNum = parseInt(gd);
    let gdClass = isNaN(gdNum) ? '' : gdNum > 0 ? 'pos' : gdNum < 0 ? 'neg' : '';
    let gdDisplay = isNaN(gdNum) ? gd : gdNum > 0 ? `+${gdNum}` : `${gdNum}`;

    // Zone classification (approximate)
    let zoneClass = '';
    if (rank <= 4)                          zoneClass = 'z-cl';   // Libertadores
    else if (rank <= 6)                     zoneClass = 'z-sul';  // Sudamericana
    else if (rank > totalTeams - 3)         zoneClass = 'z-rel';  // Relegation

    const tr = document.createElement('tr');
    tr.className = zoneClass;
    tr.innerHTML = `
      <td>${rank}</td>
      <td>
        <div class="team-cell">
          ${logo ? `<img class="team-logo" src="${logo}" alt="" onerror="this.style.display='none'">` : ''}
          <span class="team-name">${name}</span>
        </div>
      </td>
      <td>${gp}</td><td>${w}</td><td>${d}</td><td>${l}</td>
      <td>${gf}</td><td>${gc}</td>
      <td class="gd ${gdClass}">${gdDisplay}</td>
      <td class="pts">${pts}</td>
    `;
    tbody.appendChild(tr);
  });
}

/* ── SCORES ── */
async function loadScores() {
  scoresLoaded = true;
  try {
    const res = await fetch(SCORES_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderScores(data);
  } catch(e) {
    document.getElementById('scores-loading').style.display = 'none';
    const el = document.getElementById('scores-error');
    el.style.display = '';
    el.innerHTML = `<div id="error">Error al cargar partidos: ${e.message}</div>`;
  }
}

function renderScores(data) {
  document.getElementById('scores-loading').style.display = 'none';
  const wrap = document.getElementById('scores-wrap');
  wrap.style.display = '';
  wrap.innerHTML = '';

  const events = data.events || [];
  if (events.length === 0) {
    wrap.innerHTML = '<div style="text-align:center;color:#555;padding:40px;letter-spacing:2px;font-size:12px">No hay partidos disponibles en este momento</div>';
    return;
  }

  events.forEach(ev => {
    const comp   = ev.competitions?.[0] || {};
    const comps  = comp.competitors || [];
    const home   = comps.find(c => c.homeAway === 'home') || comps[0] || {};
    const away   = comps.find(c => c.homeAway === 'away') || comps[1] || {};
    const status = ev.status || {};
    const stType = status.type || {};

    const homeName  = home.team?.shortDisplayName || home.team?.displayName || '—';
    const awayName  = away.team?.shortDisplayName || away.team?.displayName || '—';
    const homeScore = home.score ?? '—';
    const awayScore = away.score ?? '—';

    const dateStr   = ev.date ? new Date(ev.date).toLocaleString('es-AR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
    const stateId   = stType.id || stType.state || '';
    const stateDesc = stType.shortDetail || stType.description || '';
    let statusClass = 'status-sched', statusLabel = stateDesc || dateStr;
    if (stateId === '2' || stType.state === 'in')       { statusClass='status-live'; statusLabel = stateDesc || 'EN VIVO'; }
    else if (stateId === '3' || stType.state === 'post') { statusClass='status-ft';   statusLabel = 'FT'; }

    const card = document.createElement('div');
    card.className = 'match-card';
    card.innerHTML = `
      <div class="match-date">${dateStr}</div>
      <div class="match-teams">
        <div class="match-team home"><div class="match-team-name">${homeName}</div></div>
        <div class="match-score-box">
          <span class="match-score">${homeScore}</span>
          <span class="match-score-sep">-</span>
          <span class="match-score">${awayScore}</span>
        </div>
        <div class="match-team away"><div class="match-team-name">${awayName}</div></div>
      </div>
      <div class="match-status ${statusClass}">${statusLabel}</div>
    `;
    wrap.appendChild(card);
  });
}

/* Init */
loadStandings();
</script>
</body>
</html>
