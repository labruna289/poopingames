<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BOMBER — LAS VEGAS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:#0a0010; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:'Courier New',monospace; overflow:hidden; touch-action:none;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 20% 30%,rgba(255,0,200,0.08) 0%,transparent 60%),
      radial-gradient(ellipse at 80% 70%,rgba(0,200,255,0.08) 0%,transparent 60%),
      radial-gradient(ellipse at 50% 100%,rgba(255,180,0,0.06) 0%,transparent 50%);
    pointer-events:none; z-index:0;
  }
  body::after {
    content:''; position:fixed; inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.1) 3px,rgba(0,0,0,0.1) 4px);
    pointer-events:none; z-index:200;
  }

  #app { position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; gap:10px; padding:12px; width:100%; max-width:640px; }

  /* Title */
  #title-wrap { display:flex; align-items:center; }
  #title { font-family:'Arial Black',sans-serif; font-size:38px; font-weight:900; letter-spacing:6px; line-height:1; user-select:none; }
  .t1{color:#ff00cc;text-shadow:0 0 10px #ff00cc,0 0 30px #ff00cc;}
  .t2{color:#ffffff;text-shadow:0 0 10px #fff;animation:flicker1 4s infinite;}
  .t3{color:#ffe600;text-shadow:0 0 10px #ffe600,0 0 30px #ffe600;}
  .t4{color:#00ffe7;text-shadow:0 0 10px #00ffe7,0 0 30px #00ffe7;animation:flicker2 5s infinite;}
  .t5{color:#ff4400;text-shadow:0 0 10px #ff4400,0 0 30px #ff4400;}
  .t6{color:#cc00ff;text-shadow:0 0 10px #cc00ff,0 0 30px #cc00ff;}
  @keyframes flicker1{0%,96%,100%{opacity:1;}97%{opacity:0.15;}98%{opacity:1;}99%{opacity:0.35;}}
  @keyframes flicker2{0%,88%,92%,100%{opacity:1;}89%{opacity:0.1;}90%{opacity:1;}91%{opacity:0.25;}}
  .bulbs{display:flex;gap:5px;align-items:center;}
  .bulb{width:6px;height:6px;border-radius:50%;animation:bulb-chase 1.2s linear infinite;}
  .bulb:nth-child(1){background:#ff00cc;box-shadow:0 0 5px #ff00cc;animation-delay:0s;}
  .bulb:nth-child(2){background:#ffe600;box-shadow:0 0 5px #ffe600;animation-delay:.15s;}
  .bulb:nth-child(3){background:#00ffe7;box-shadow:0 0 5px #00ffe7;animation-delay:.3s;}
  .bulb:nth-child(4){background:#ff4400;box-shadow:0 0 5px #ff4400;animation-delay:.45s;}
  .bulb:nth-child(5){background:#ff00cc;box-shadow:0 0 5px #ff00cc;animation-delay:.6s;}
  @keyframes bulb-chase{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.12;transform:scale(0.6);}}

  /* HUD */
  #hud { display:flex; gap:14px; align-items:center; }
  .hud-box { text-align:center; padding:5px 14px; border:1px solid rgba(255,255,255,0.1); border-radius:4px; background:rgba(0,0,0,0.4); position:relative; min-width:80px; }
  .hud-box::before { content:''; position:absolute; inset:-1px; border-radius:4px; background:linear-gradient(135deg,rgba(255,0,204,0.3),rgba(0,255,231,0.3)); z-index:-1; filter:blur(4px); }
  .hud-label { font-size:9px; letter-spacing:3px; color:#556677; margin-bottom:2px; }
  .hud-val   { font-size:24px; font-weight:700; letter-spacing:2px; line-height:1.1; }
  #score-val { color:#ff00cc; text-shadow:0 0 10px #ff00cc; }
  #level-val { color:#00ffe7; text-shadow:0 0 10px #00ffe7; }
  #lives-val { color:#ffe600; text-shadow:0 0 10px #ffe600; }

  /* Canvas */
  #canvas-wrap { position:relative; display:inline-block; touch-action:none; }
  #canvas-wrap::before { content:''; position:absolute; inset:-3px; border-radius:6px; background:linear-gradient(90deg,#ff00cc,#ffe600,#00ffe7,#ff4400,#ff00cc); background-size:300% 100%; animation:border-run 3s linear infinite; z-index:-1; filter:blur(2px); }
  #canvas-wrap::after  { content:''; position:absolute; inset:-6px; border-radius:8px; background:linear-gradient(90deg,#ff00cc,#ffe600,#00ffe7,#ff4400,#ff00cc); background-size:300% 100%; animation:border-run 3s linear infinite; z-index:-2; filter:blur(8px); opacity:0.5; }
  @keyframes border-run{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  canvas { display:block; border-radius:3px; touch-action:none; }

  /* Overlay */
  #overlay { position:absolute; inset:0; background:rgba(10,0,16,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; border-radius:3px; backdrop-filter:blur(4px); cursor:pointer; z-index:10; }
  #overlay.hidden { display:none; }
  .ov-icon  { font-size:48px; line-height:1; animation:pulse-icon 1.5s ease-in-out infinite; }
  @keyframes pulse-icon{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
  .ov-title { font-family:'Arial Black',sans-serif; font-size:20px; letter-spacing:8px; }
  .ov-hint  { font-size:11px; letter-spacing:3px; color:#445566; margin-top:2px; text-align:center; line-height:1.8; }
  #ov-sub   { font-size:14px; letter-spacing:4px; color:#aabbcc; display:none; }
  .ov-start .ov-icon  { color:#00ffe7; text-shadow:0 0 20px #00ffe7; }
  .ov-start .ov-title { color:#00ffe7; text-shadow:0 0 18px #00ffe7,0 0 40px #00ffe7; }
  .ov-dead  .ov-icon  { color:#ff4400; text-shadow:0 0 20px #ff4400; animation:none; }
  .ov-dead  .ov-title { color:#ff4400; text-shadow:0 0 18px #ff4400; }
  .ov-win   .ov-icon  { color:#ffe600; text-shadow:0 0 20px #ffe600; animation:none; }
  .ov-win   .ov-title { color:#ffe600; text-shadow:0 0 18px #ffe600; }

  /* Mobile joystick area */
  #mobile-controls {
    display:none;
    width:100%;
    position:relative;
    height:120px;
    touch-action:none;
    user-select:none;
  }
  #mobile-controls.visible { display:block; }

  /* Virtual joystick base */
  #joystick-zone {
    position:absolute;
    left:12px; top:10px;
    width:100px; height:100px;
    border-radius:50%;
    border:2px solid rgba(0,255,231,0.25);
    background:rgba(0,255,231,0.05);
    display:flex; align-items:center; justify-content:center;
  }
  #joystick-knob {
    width:40px; height:40px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#00ffe7,#006655);
    box-shadow:0 0 16px #00ffe7;
    position:absolute;
    transform:translate(-50%,-50%);
    left:50%; top:50%;
    transition:left 0.05s,top 0.05s;
    pointer-events:none;
  }

  /* Bomb button */
  #bomb-btn {
    position:absolute;
    right:16px; top:10px;
    width:100px; height:100px;
    border-radius:50%;
    border:3px solid #ff4400;
    background:rgba(255,68,0,0.12);
    box-shadow:0 0 20px rgba(255,68,0,0.3);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:4px;
    cursor:pointer; touch-action:none;
    transition:background 0.1s, box-shadow 0.1s, transform 0.08s;
  }
  #bomb-btn:active, #bomb-btn.pressed {
    background:rgba(255,68,0,0.35);
    box-shadow:0 0 40px rgba(255,68,0,0.7);
    transform:scale(0.9);
  }
  #bomb-btn .bomb-icon { font-size:30px; }
  #bomb-btn .bomb-lbl  { font-size:10px; letter-spacing:2px; color:#ff4400; }

  /* Bomb cooldown arc drawn in CSS via clip */
  #hint { font-size:10px; letter-spacing:3px; color:#1e1030; text-align:center; margin-top:-4px; }
</style>
</head>
<body>
<div id="app">
  <div id="title-wrap">
    <div class="bulbs"><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div></div>
    &nbsp;
    <div id="title">
      <span class="t1">B</span><span class="t2">O</span><span class="t3">M</span><span class="t4">B</span><span class="t5">E</span><span class="t6">R</span>
    </div>
    &nbsp;
    <div class="bulbs"><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div></div>
  </div>

  <div id="hud">
    <div class="hud-box"><div class="hud-label">SCORE</div><div class="hud-val" id="score-val">0</div></div>
    <div class="hud-box"><div class="hud-label">LEVEL</div><div class="hud-val" id="level-val">1</div></div>
    <div class="hud-box"><div class="hud-label">LIVES</div><div class="hud-val" id="lives-val">✈✈✈</div></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="overlay" class="ov-start">
      <div class="ov-icon">✈</div>
      <div class="ov-title">INSERT COIN</div>
      <div id="ov-sub"></div>
      <div class="ov-hint">
        KEYBOARD: ↑↓ climb/dive · ←→ fly left/right · SPACE bomb<br>
        MOBILE: joystick to steer · button to drop bomb
      </div>
    </div>
  </div>

  <!-- Mobile controls: joystick + bomb button -->
  <div id="mobile-controls">
    <div id="joystick-zone">
      <div id="joystick-knob"></div>
    </div>
    <div id="bomb-btn">
      <div class="bomb-icon">💣</div>
      <div class="bomb-lbl">BOMB</div>
    </div>
  </div>

  <div id="hint">DESTROY ALL TARGETS TO ADVANCE</div>
</div>

<script>
(function(){
  // ── Constants ────────────────────────────────────────────────
  const W=540, H=340;
  const PLANE_W=34, PLANE_H=14;
  const GRAVITY=0.06;
  const THRUST=0.18;
  const DRAG=0.985;
  const ANGULAR_DRAG=0.88;
  const PITCH_SPEED=0.045;
  const BOMB_R=6;
  const BOMB_GRAVITY=0.22;
  const EXPLOSION_R=32;
  const GROUND_Y=H-36;
  const WIN_SCORE_PER_LEVEL=100;
  const BOMB_COOLDOWN=40; // frames
  const MAX_LIVES=3;

  // ── DOM ──────────────────────────────────────────────────────
  const canvas=document.getElementById('c');
  const ctx=canvas.getContext('2d');
  canvas.width=W; canvas.height=H;
  const scoreEl=document.getElementById('score-val');
  const levelEl=document.getElementById('level-val');
  const livesEl=document.getElementById('lives-val');
  const overlay=document.getElementById('overlay');
  const ovIcon=overlay.querySelector('.ov-icon');
  const ovTitle=overlay.querySelector('.ov-title');
  const ovSub=document.getElementById('ov-sub');
  const mobileCtrl=document.getElementById('mobile-controls');
  const joystickZone=document.getElementById('joystick-zone');
  const joystickKnob=document.getElementById('joystick-knob');
  const bombBtn=document.getElementById('bomb-btn');

  // ── Touch detection ──────────────────────────────────────────
  const isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
  if(isTouch) mobileCtrl.classList.add('visible');

  // ── State ────────────────────────────────────────────────────
  let plane, bombs, targets, explosions, particles, clouds;
  let score, level, lives, running, loopId;
  let bombCooldown=0;
  let camX=0; // scrolling world

  // Input state
  const keys={up:false,down:false,left:false,right:false,space:false};
  let spaceWas=false;
  // Joystick
  let joyActive=false, joyId=null, joyOx=0, joyOy=0;
  let joyDx=0, joyDy=0; // normalized -1..1
  const JOY_RADIUS=38;
  // Bomb touch
  let bombTouchActive=false;
  let bombTouchWas=false;

  // ── Level target configs ─────────────────────────────────────
  function buildTargets(lvl){
    const arr=[];
    const count=4+lvl*2;
    const spacing=Math.max(60,Math.floor((W*2.2)/count));
    for(let i=0;i<count;i++){
      const type=Math.random()<0.3+lvl*0.1?'hard':'normal';
      const w=type==='hard'?28:22, h=type==='hard'?20:16;
      arr.push({
        x:120+i*spacing+(Math.random()*30-15),
        y:GROUND_Y-h,
        w,h,
        hp:type==='hard'?2:1, maxHp:type==='hard'?2:1,
        type,
        flash:0,
      });
    }
    return arr;
  }

  function buildClouds(){
    return Array.from({length:14},(_,i)=>({
      x:Math.random()*W*3,
      y:20+Math.random()*(H*0.45),
      r:20+Math.random()*40,
      speed:0.2+Math.random()*0.4,
      alpha:0.06+Math.random()*0.1,
    }));
  }

  // ── Init ─────────────────────────────────────────────────────
  function initLevel(){
    plane={
      x:80, y:H*0.4,
      vx:2.5, vy:0,
      angle:0,
      facing:1,
      alive:true,
    };
    bombs=[]; explosions=[]; particles=[];
    targets=buildTargets(level);
    clouds=buildClouds();
    camX=plane.x - W*0.5;
    bombCooldown=0;
  }

  function startGame(){
    score=0; level=1; lives=MAX_LIVES;
    scoreEl.textContent=0; levelEl.textContent=1;
    livesEl.textContent='✈'.repeat(lives);
    initLevel();
    overlay.className='ov-start hidden'; ovSub.style.display='none';
    running=true;
    if(loopId)cancelAnimationFrame(loopId);
    loopId=requestAnimationFrame(gameLoop);
  }

  function nextLevel(){
    level++;
    levelEl.textContent=level;
    running=false;
    overlay.className='ov-win';
    ovIcon.textContent='🏆';
    ovTitle.textContent='LEVEL CLEAR!';
    ovSub.textContent='Score: '+score; ovSub.style.display='block';
    overlay.classList.remove('hidden');
    setTimeout(()=>{
      initLevel();
      overlay.classList.add('hidden');
      running=true;
    },1800);
  }

  function diePlane(){
    if(!plane.alive)return;
    plane.alive=false;
    spawnExplosion(plane.x,plane.y,'#ff4400',40);
    lives--;
    livesEl.textContent='✈'.repeat(Math.max(0,lives));
    setTimeout(()=>{
      if(lives<=0){
        running=false;
        overlay.className='ov-dead';
        ovIcon.textContent='💀'; ovTitle.textContent='GAME OVER';
        ovSub.textContent='Score: '+score; ovSub.style.display='block';
        overlay.classList.remove('hidden');
      } else {
        plane={x:60,y:H*0.35,vx:2.5,vy:0,angle:0,facing:1,alive:true};
        bombCooldown=0;
      }
    },1200);
  }

  // ── Drop bomb ────────────────────────────────────────────────
  function dropBomb(){
    if(!running||!plane.alive||bombCooldown>0)return;
    bombs.push({
      x:plane.x, y:plane.y,
      vx:plane.vx*0.7,
      vy:plane.vy+1.5,
      r:BOMB_R, alive:true, trail:[],
    });
    bombCooldown=BOMB_COOLDOWN;
  }

  // ── Particles / Explosions ───────────────────────────────────
  function spawnExplosion(x,y,color,n=22){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=1.5+Math.random()*5;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,color,size:2+Math.random()*5});
    }
    explosions.push({x,y,r:0,maxR:EXPLOSION_R,color,life:1});
  }

  function updateParticles(){
    particles=particles.filter(p=>p.life>0);
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.03;p.vx*=0.96;});
  }

  function updateExplosions(){
    explosions=explosions.filter(e=>e.life>0);
    explosions.forEach(e=>{e.r+=e.maxR*0.12;if(e.r>e.maxR)e.r=e.maxR;e.life-=0.05;});
  }

  // ── Physics ──────────────────────────────────────────────────
  function updatePlane(){
    if(!plane.alive)return;

    // ── Hungry Shark / side-scroller model ──────────────────
    // plane.facing: 1 = right, -1 = left
    // plane.angle: visual nose tilt (-0.5..0.5 rad)
    // ↑/↓ (or joystick Y) → pitch nose up/down (adds vertical velocity)
    // ←/→ (or joystick X) → flip facing + add horizontal thrust
    // SPACE / bomb button → drop bomb

    let vertInput=0, horizInput=0;

    if(isTouch){
      // Joystick: X controls horizontal thrust/facing, Y controls vertical
      horizInput = joyDx;
      vertInput  = joyDy;
    } else {
      if(keys.up)    vertInput  = -1;
      if(keys.down)  vertInput  =  1;
      if(keys.right) horizInput =  1;
      if(keys.left)  horizInput = -1;
    }

    // Flip facing based on horizontal input
    if(horizInput > 0.2)  plane.facing =  1;
    if(horizInput < -0.2) plane.facing = -1;

    // Horizontal thrust: always in facing direction, scaled by |horizInput|
    const hPower = Math.abs(horizInput);
    plane.vx += plane.facing * THRUST * hPower * 2.2;

    // Vertical: pitch nose up/down and add vertical velocity
    plane.vy += vertInput * THRUST * 2.5;

    // Gravity
    plane.vy += GRAVITY;

    // Drag
    plane.vx *= DRAG;
    plane.vy *= DRAG;

    // Tilt angle follows velocity direction smoothly
    const targetAngle = Math.atan2(plane.vy, Math.abs(plane.vx)) * 0.7;
    plane.angle += (targetAngle - plane.angle) * 0.12;

    // Clamp max speed
    const sp = Math.sqrt(plane.vx**2 + plane.vy**2);
    const maxSp = 9;
    if(sp > maxSp){ plane.vx=plane.vx/sp*maxSp; plane.vy=plane.vy/sp*maxSp; }

    // Minimum horizontal speed so it always moves
    if(Math.abs(plane.vx) < 1.2) plane.vx = plane.facing * 1.2;

    plane.x += plane.vx;
    plane.y += plane.vy;

    // Camera: keep plane centered horizontally
    camX += (plane.x - camX - W*0.5) * 0.09;

    // Ground/ceiling
    if(plane.y >= GROUND_Y - PLANE_H/2){ diePlane(); return; }
    if(plane.y <= 10){ plane.y=10; plane.vy=Math.abs(plane.vy)*0.5; }

    // Bomb cooldown
    if(bombCooldown>0) bombCooldown--;

    // Drop bomb
    const dropNow = isTouch
      ? (bombTouchActive && !bombTouchWas)
      : (keys.space && !spaceWas);
    if(dropNow) dropBomb();
    spaceWas = keys.space;
    bombTouchWas = bombTouchActive;
  }

  function updateBombs(){
    bombs=bombs.filter(b=>b.alive);
    bombs.forEach(b=>{
      b.trail.push({x:b.x,y:b.y,life:1});
      if(b.trail.length>10) b.trail.shift();
      b.trail.forEach(t=>t.life-=0.12);
      b.vy+=BOMB_GRAVITY;
      b.vx*=0.99;
      b.x+=b.vx; b.y+=b.vy;

      // Hit ground
      if(b.y+b.r>=GROUND_Y){
        b.alive=false;
        spawnExplosion(b.x,GROUND_Y,'#ff4400',18);
        checkBombTargets(b.x,GROUND_Y);
        return;
      }
      // Off-screen
      if(b.x<camX-200||b.x>camX+W+200||b.y>H+60){b.alive=false;return;}

      // Hit targets mid-air
      targets.forEach(t=>{
        if(t.hp<=0)return;
        if(b.x+b.r>t.x&&b.x-b.r<t.x+t.w&&b.y+b.r>t.y&&b.y-b.r<t.y+t.h){
          b.alive=false;
          spawnExplosion(t.x+t.w/2,t.y+t.h/2,'#ffe600',24);
          t.hp--; t.flash=8;
          if(t.hp<=0){
            score+=t.maxHp===2?25:10;
            scoreEl.textContent=score;
          }
        }
      });
    });
  }

  function checkBombTargets(bx,by){
    targets.forEach(t=>{
      if(t.hp<=0)return;
      const cx=t.x+t.w/2, cy=t.y+t.h/2;
      if(Math.abs(bx-cx)<EXPLOSION_R*1.2&&Math.abs(by-cy)<EXPLOSION_R+t.h){
        t.hp--; t.flash=8;
        spawnExplosion(cx,cy,'#ffe600',20);
        if(t.hp<=0){
          score+=t.maxHp===2?25:10;
          scoreEl.textContent=score;
        }
      }
    });
  }

  // ── Draw ─────────────────────────────────────────────────────
  function draw(){
    // Sky gradient
    const sky=ctx.createLinearGradient(0,0,0,GROUND_Y);
    sky.addColorStop(0,'#050018');
    sky.addColorStop(1,'#0a1a2a');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.translate(-camX,0);

    // Stars
    ctx.fillStyle='rgba(255,255,255,0.55)';
    for(let i=0;i<60;i++){
      const sx=camX-400+((i*337+77)%((W+1200))), sy=((i*191)%(GROUND_Y-20));
      ctx.fillRect(sx,sy,1,1);
    }

    // Clouds
    clouds.forEach(cl=>{
      ctx.save();
      ctx.globalAlpha=cl.alpha;
      ctx.fillStyle='#ffffff';
      ctx.shadowColor='#aaddff'; ctx.shadowBlur=20;
      ctx.beginPath(); ctx.arc(cl.x,cl.y,cl.r,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cl.x+cl.r*0.6,cl.y+cl.r*0.2,cl.r*0.7,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cl.x-cl.r*0.5,cl.y+cl.r*0.3,cl.r*0.6,0,Math.PI*2); ctx.fill();
      ctx.restore();
      cl.x-=cl.speed;
      if(cl.x+cl.r*2<camX-200) cl.x=camX+W+100+Math.random()*300;
      if(cl.x-cl.r*2>camX+W+200) cl.x=camX-100-Math.random()*300;
    });

    // Ground
    const groundGrad=ctx.createLinearGradient(0,GROUND_Y,0,H);
    groundGrad.addColorStop(0,'#1a3322');
    groundGrad.addColorStop(1,'#0a1a0a');
    ctx.fillStyle=groundGrad;
    ctx.fillRect(camX-300,GROUND_Y,W+600,H-GROUND_Y);
    ctx.save();
    ctx.strokeStyle='#ff00cc'; ctx.lineWidth=2;
    ctx.shadowColor='#ff00cc'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.moveTo(camX-300,GROUND_Y); ctx.lineTo(camX+W+300,GROUND_Y); ctx.stroke();
    ctx.restore();

    // Ground details: buildings silhouettes
    // Generate buildings across the full visible world in both directions
    const bldgBase=Math.floor((camX-400)/200)*200;
    const bldgs=Array.from({length:16},(_,i)=>bldgBase+i*200+(i*73%80));
    bldgs.forEach(bx=>{
      const bh=20+((bx*7)%40), bw=18+((bx*3)%24);
      ctx.save();
      ctx.fillStyle='rgba(255,0,200,0.06)';
      ctx.fillRect(bx,GROUND_Y-bh,bw,bh);
      ctx.restore();
    });

    // Targets
    targets.forEach(t=>{
      if(t.hp<=0)return;
      const flash=t.flash>0;
      let color=t.maxHp===2?'#ff4400':'#00ffe7';
      ctx.save();
      ctx.shadowColor=flash?'#fff':color; ctx.shadowBlur=flash?24:10;
      ctx.fillStyle=flash?'#fff':color;
      roundRect(ctx,t.x,t.y,t.w,t.h,3); ctx.fill();
      // Shine
      const sh=ctx.createLinearGradient(t.x,t.y,t.x,t.y+t.h);
      sh.addColorStop(0,'rgba(255,255,255,0.3)'); sh.addColorStop(0.5,'rgba(255,255,255,0)');
      ctx.fillStyle=sh; roundRect(ctx,t.x,t.y,t.w,t.h/2,3); ctx.fill();
      // HP pips
      if(t.maxHp>1&&t.hp>0){
        for(let i=0;i<t.maxHp;i++){
          ctx.fillStyle=i<t.hp?color:'#33002288';
          ctx.beginPath(); ctx.arc(t.x+7+i*9,t.y+t.h-6,3,0,Math.PI*2); ctx.fill();
        }
      }
      if(t.flash>0)t.flash--;
      ctx.restore();
    });

    // Explosions
    explosions.forEach(e=>{
      if(e.life<=0)return;
      ctx.save();
      ctx.globalAlpha=e.life*0.5;
      const g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r);
      g.addColorStop(0,'#ffffff');
      g.addColorStop(0.3,'#ffe600');
      g.addColorStop(1,'rgba(255,68,0,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });

    // Particles
    particles.forEach(p=>{
      ctx.save(); ctx.globalAlpha=p.life;
      ctx.shadowColor=p.color; ctx.shadowBlur=8; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0,p.size*p.life),0,Math.PI*2); ctx.fill();
      ctx.restore();
    });

    // Bomb trails + bombs
    bombs.forEach(b=>{
      b.trail.forEach(t=>{
        ctx.save(); ctx.globalAlpha=Math.max(0,t.life)*0.4;
        ctx.fillStyle='#ff8800';
        ctx.beginPath(); ctx.arc(t.x,t.y,Math.max(0,3*t.life),0,Math.PI*2); ctx.fill();
        ctx.restore();
      });
      if(!b.alive)return;
      ctx.save();
      ctx.shadowColor='#ff4400'; ctx.shadowBlur=14;
      ctx.fillStyle='#ff4400';
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
      // Fuse spark
      ctx.fillStyle='#ffe600';
      ctx.beginPath(); ctx.arc(b.x+b.r*0.6,b.y-b.r*0.7,2,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });

    // Plane
    if(plane.alive){
      drawPlane(plane.x,plane.y,plane.angle,plane.facing<0);
    }

    ctx.restore(); // un-translate

    // HUD overlays (screen space)
    // Bomb cooldown bar
    if(bombCooldown>0){
      const pct=1-bombCooldown/BOMB_COOLDOWN;
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(W/2-40,H-18,80,6);
      ctx.fillStyle='#ff4400';
      ctx.shadowColor='#ff4400'; ctx.shadowBlur=8;
      ctx.fillRect(W/2-40,H-18,80*pct,6);
      ctx.fillStyle='rgba(255,68,0,0.4)';
      ctx.font='8px Courier New'; ctx.textAlign='center';
      ctx.fillText('RELOAD',W/2,H-6);
      ctx.restore();
    }

    // Target counter
    const remaining=targets.filter(t=>t.hp>0).length;
    ctx.save();
    ctx.fillStyle='rgba(0,255,231,0.5)';
    ctx.font='10px Courier New'; ctx.textAlign='right';
    ctx.fillText('TARGETS: '+remaining, W-10, 22);
    ctx.restore();

    // Neon border
    ctx.save();
    ctx.strokeStyle='#ff00cc'; ctx.lineWidth=2;
    ctx.shadowColor='#ff00cc'; ctx.shadowBlur=20;
    ctx.strokeRect(1,1,W-2,H-2);
    ctx.restore();
  }

  function drawPlane(x,y,angle,flip){
    ctx.save();
    ctx.translate(x,y);
    // If flying left, flip vertically
    if(flip) ctx.scale(1,-1);
    ctx.rotate(angle);

    // Glow
    ctx.shadowColor='#00ffe7'; ctx.shadowBlur=20;

    // Fuselage
    ctx.fillStyle='#00ffe7';
    ctx.beginPath();
    ctx.moveTo(PLANE_W/2,0);
    ctx.lineTo(-PLANE_W*0.3,PLANE_H*0.4);
    ctx.lineTo(-PLANE_W/2,PLANE_H*0.3);
    ctx.lineTo(-PLANE_W/2,-PLANE_H*0.3);
    ctx.lineTo(-PLANE_W*0.3,-PLANE_H*0.4);
    ctx.closePath();
    ctx.fill();

    // Wings
    ctx.fillStyle='#00b89c';
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(-PLANE_W*0.2,PLANE_H*1.1);
    ctx.lineTo(-PLANE_W*0.55,PLANE_H*0.9);
    ctx.lineTo(-PLANE_W*0.3,0);
    ctx.closePath();
    ctx.fill();

    // Tail
    ctx.fillStyle='#006655';
    ctx.beginPath();
    ctx.moveTo(-PLANE_W*0.35,0);
    ctx.lineTo(-PLANE_W*0.5,PLANE_H*0.8);
    ctx.lineTo(-PLANE_W/2,0);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle='#ffe600'; ctx.shadowColor='#ffe600'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(PLANE_W*0.12,0,PLANE_H*0.28,0,Math.PI*2); ctx.fill();

    // Engine exhaust (animated)
    const t=Date.now()/80;
    ctx.fillStyle='rgba(255,150,0,'+( 0.4+0.3*Math.sin(t))+')';
    ctx.beginPath();
    ctx.moveTo(-PLANE_W/2,0);
    ctx.lineTo(-PLANE_W/2-8-4*Math.sin(t),PLANE_H*0.15);
    ctx.lineTo(-PLANE_W/2-8-4*Math.sin(t),-PLANE_H*0.15);
    ctx.closePath(); ctx.fill();

    ctx.restore();
  }

  // ── Game loop ────────────────────────────────────────────────
  function gameLoop(){
    if(running){
      updatePlane();
      updateBombs();
      updateParticles();
      updateExplosions();
      // Check win
      if(targets.every(t=>t.hp<=0)) nextLevel();
    }
    draw();
    loopId=requestAnimationFrame(gameLoop);
  }

  // ── Keyboard ─────────────────────────────────────────────────
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'||e.key==='w')   {e.preventDefault();keys.up=true;}
    if(e.key==='ArrowDown'||e.key==='s') {e.preventDefault();keys.down=true;}
    if(e.key==='ArrowLeft'||e.key==='a') {e.preventDefault();keys.left=true;}
    if(e.key==='ArrowRight'||e.key==='d'){e.preventDefault();keys.right=true;}
    if(e.key===' ')                      {e.preventDefault();keys.space=true;}
    if(!running&&e.key===' ')            startGame();
  });
  document.addEventListener('keyup',e=>{
    if(e.key==='ArrowUp'||e.key==='w')   keys.up=false;
    if(e.key==='ArrowDown'||e.key==='s') keys.down=false;
    if(e.key==='ArrowLeft'||e.key==='a') keys.left=false;
    if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
    if(e.key===' ')                      keys.space=false;
  });

  // ── Joystick (Hungry Shark style) ────────────────────────────
  const joyRect=()=>joystickZone.getBoundingClientRect();

  function joyStart(cx,cy){
    joyActive=true;
    joyUpdate(cx,cy);
  }
  function joyUpdate(cx,cy){
    const r=joyRect();
    const ox=r.left+r.width/2, oy=r.top+r.height/2;
    let dx=cx-ox, dy=cy-oy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>JOY_RADIUS){dx=dx/dist*JOY_RADIUS;dy=dy/dist*JOY_RADIUS;}
    joyDx=dx/JOY_RADIUS; joyDy=dy/JOY_RADIUS;
    joystickKnob.style.left=(r.width/2+dx)+'px';
    joystickKnob.style.top=(r.height/2+dy)+'px';
  }
  function joyEnd(){
    joyActive=false; joyDx=0; joyDy=0;
    joystickKnob.style.left='50%';
    joystickKnob.style.top='50%';
  }

  joystickZone.addEventListener('touchstart',e=>{
    e.preventDefault();
    const t=e.changedTouches[0];
    joyId=t.identifier; joyStart(t.clientX,t.clientY);
  },{passive:false});
  document.addEventListener('touchmove',e=>{
    for(const t of e.changedTouches){
      if(t.identifier===joyId){joyUpdate(t.clientX,t.clientY);break;}
    }
  },{passive:false});
  document.addEventListener('touchend',e=>{
    for(const t of e.changedTouches){
      if(t.identifier===joyId){joyEnd();joyId=null;break;}
    }
  },{passive:false});

  // Also allow mouse drag on joystick for desktop testing
  let joyMouse=false;
  joystickZone.addEventListener('mousedown',e=>{ joyMouse=true; joyStart(e.clientX,e.clientY); });
  document.addEventListener('mousemove',e=>{ if(joyMouse)joyUpdate(e.clientX,e.clientY); });
  document.addEventListener('mouseup',()=>{ if(joyMouse){joyMouse=false;joyEnd();} });

  // ── Bomb button ──────────────────────────────────────────────
  bombBtn.addEventListener('touchstart',e=>{e.preventDefault();bombTouchActive=true;bombBtn.classList.add('pressed');},{passive:false});
  bombBtn.addEventListener('touchend',e=>{e.preventDefault();bombTouchActive=false;bombBtn.classList.remove('pressed');},{passive:false});
  bombBtn.addEventListener('mousedown',()=>{bombTouchActive=true;bombBtn.classList.add('pressed');});
  document.addEventListener('mouseup',()=>{bombTouchActive=false;bombBtn.classList.remove('pressed');});

  // ── Overlay click ────────────────────────────────────────────
  overlay.addEventListener('click',()=>{if(!running)startGame();});

  // ── Util ─────────────────────────────────────────────────────
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath();
  }

  // Initial draw
  plane={x:80,y:H*0.4,vx:2.5,vy:0,angle:0,facing:1,alive:true};
  camX=plane.x-W*0.5;
  bombs=[]; targets=[]; explosions=[]; particles=[]; clouds=buildClouds();
  draw();
  loopId=requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
